<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="requese-t requese-d" xml:lang="en">
  <title id="requese-t">One request, from app to database</title>
  <desc id="requese-d">An app using supabase-js sends a request with its publishable key over HTTPS to the TLS proxy, then to the gateway, on a path that names one environment. The gateway refuses if the environment is in maintenance, checks the key against that environment, admits the request only if the environment is under its concurrent limit, and caps the body at 1 MiB. There is no queue: it refuses at once with 429 when the environment is full and 503 when the gateway is full or the environment paused. Admitted requests reach that environment's own Auth or REST, which reach only its own database through its own login inside the shared PostgreSQL engine. File requests go to the shared Storage process with a tenant header.</desc>
  <defs><marker id="requese-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="requese-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="470" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="24" y="34" font-size="16" font-weight="700" text-anchor="start">One request, from app to database</text>
  <rect x="24" y="150" width="124" height="66" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="86" y="178" font-size="13" font-weight="700">your app</text>
  <text x="86" y="200" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">supabase-js</text>
  <text x="86" y="240" font-size="12" fill="#5B5465">request and</text>
  <text x="86" y="256" font-size="12" fill="#5B5465">publishable key</text>
  <rect x="174" y="150" width="104" height="66" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="226" y="178" font-size="13" font-weight="700">TLS proxy</text>
  <text x="226" y="200" font-size="12">HTTPS</text>
  <rect x="304" y="64" width="244" height="236" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="426" y="90" font-size="15" font-weight="700">gateway</text>
  <text x="320" y="120" font-size="13" text-anchor="start">1. path names the environment</text>
  <text x="320" y="145" font-size="13" text-anchor="start">2. in maintenance? refuse</text>
  <text x="320" y="170" font-size="13" text-anchor="start">3. key valid for it? else 401</text>
  <text x="320" y="195" font-size="13" text-anchor="start">4. room under its limit?</text>
  <text x="320" y="220" font-size="13" text-anchor="start">5. body up to 1 MiB</text>
  <text x="426" y="280" font-size="13" font-weight="700" fill="#A8412A">no queue: refuse at once</text>
  <rect x="304" y="332" width="244" height="70" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="426" y="360" font-size="12.5">429: environment at its limit</text>
  <text x="426" y="384" font-size="12.5">503: gateway full, or paused</text>
  <path d="M426 300 L426 328" fill="none" stroke="#E06A4B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-c)"/>
  <rect x="584" y="80" width="150" height="42" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="659" y="106" font-size="13">Auth, env A</text>
  <rect x="584" y="138" width="150" height="42" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="659" y="164" font-size="13">REST, env A</text>
  <rect x="584" y="222" width="150" height="64" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="659" y="248" font-size="13" font-weight="700">Storage</text>
  <text x="659" y="268" font-size="11.5">shared, tenant header</text>
  <rect x="760" y="50" width="124" height="352" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="822" y="76" font-size="13" font-weight="700">PostgreSQL</text>
  <text x="822" y="94" font-size="12">shared engine</text>
  <rect x="772" y="112" width="100" height="90" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="822" y="138" font-size="12.5">database</text>
  <text x="822" y="158" font-size="12.5">env A</text>
  <text x="822" y="178" font-size="12.5">own logins</text>
  <rect x="772" y="222" width="100" height="40" rx="8" fill="#EAE2D2" stroke="#5B5465" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="822" y="247" font-size="12.5" fill="#5B5465">env B</text>
  <rect x="772" y="276" width="100" height="40" rx="8" fill="#EAE2D2" stroke="#5B5465" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="822" y="301" font-size="12.5" fill="#5B5465">env C</text>
  <text x="822" y="350" font-size="12">one login,</text>
  <text x="822" y="367" font-size="12">one database</text>
  <path d="M148 183 L172 183" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-i)"/>
  <path d="M278 183 L302 183" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-i)"/>
  <path d="M548 110 C566 110 566 101 582 101" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-i)"/>
  <path d="M548 150 C566 150 566 159 582 159" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-i)"/>
  <path d="M548 240 C566 240 566 254 582 254" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-i)"/>
  <path d="M734 101 C752 101 752 140 770 140" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-i)"/>
  <path d="M734 159 C752 159 752 160 770 160" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#requese-i)"/>
  <path d="M734 254 C752 254 752 186 770 186" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#requese-i)"/>
  <rect x="24" y="435" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="54" y="446" font-size="12" fill="#5B5465" text-anchor="start">shared by every environment</text>
  <rect x="254.8" y="435" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="284.8" y="446" font-size="12" fill="#5B5465" text-anchor="start">one per environment (env A shown)</text>
  <rect x="524.0" y="435" width="22" height="14" rx="3" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="554.0" y="446" font-size="12" fill="#5B5465" text-anchor="start">environment database</text>
  </g>
</svg>
