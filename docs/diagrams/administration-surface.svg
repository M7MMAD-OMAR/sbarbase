<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">سطح إدارة صبّار بيز</title>
  <desc id="d">لوحة المنصة تدير المنظمات والمشاريع والبيئات، وتُسلّم كل بيئة إلى ستوديو سوبابيز الأصلي، مع قاعدة بيانات وخدمات مستقلة لكل بيئة.</desc>
  <style>
    text{font-family:"Noto Sans Arabic","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#ededed}
    .title{font-size:44px;font-weight:600;letter-spacing:-1px}
    .sub{font-size:21px;fill:#a0a0a0}
    .section{font-size:22px;font-weight:600}
    .chip{font-size:20px;fill:#ededed}
    .small{font-size:17px;fill:#a0a0a0}
    .note{font-size:19px;fill:#a0a0a0}
    .accentText{fill:#3ecf8e}
    .foot{font-size:17px;fill:#8a8a8a}
    .latin{font-family:"Manrope",system-ui,sans-serif}
  </style>

  <rect width="1600" height="1000" fill="#171717"/>

  <text class="title" x="1520" y="76" text-anchor="end">صبّار بيز: سطح الإدارة</text>
  <text class="sub" x="1520" y="118" text-anchor="end">لوحة المنصة من صنعنا، وستوديو سوبابيز الأصلي داخل كل بيئة</text>

  <!-- platform layer -->
  <rect x="80" y="152" width="1440" height="176" fill="#1c1c1c" stroke="#303030" stroke-width="1"/>
  <text class="section" x="1496" y="196" text-anchor="end">لوحة المنصة</text>
  <text class="small" x="1496" y="224" text-anchor="end">تملك الهرمية ولا تدخل داخل البيئة</text>
  <g>
    <rect x="1208" y="244" width="200" height="60" fill="#202020" stroke="#303030"/>
    <text class="chip" x="1308" y="283" text-anchor="middle">المنظمات</text>
    <rect x="976" y="244" width="200" height="60" fill="#202020" stroke="#303030"/>
    <text class="chip" x="1076" y="283" text-anchor="middle">المشاريع</text>
    <rect x="744" y="244" width="200" height="60" fill="#202020" stroke="#303030"/>
    <text class="chip" x="844" y="283" text-anchor="middle">البيئات</text>
    <rect x="512" y="244" width="200" height="60" fill="#202020" stroke="#303030"/>
    <text class="chip" x="612" y="283" text-anchor="middle">بيانات الاتصال</text>
    <rect x="280" y="244" width="200" height="60" fill="#202020" stroke="#303030"/>
    <text class="chip" x="380" y="283" text-anchor="middle">المفاتيح</text>
    <rect x="112" y="244" width="200" height="60" fill="#202020" stroke="#303030"/>
    <text class="chip" x="212" y="283" text-anchor="middle">حالة التزويد</text>
  </g>

  <!-- handoff arrow -->
  <path d="M800 336 L800 372" stroke="#3ecf8e" stroke-width="2"/>
  <path d="M792 364 L800 378 L808 364" fill="none" stroke="#3ecf8e" stroke-width="2"/>
  <text class="accentText" x="800" y="360" text-anchor="middle" font-size="19" style="fill:#3ecf8e">تسليم لكل بيئة</text>

  <!-- environment A -->
  <rect x="840" y="392" width="680" height="256" fill="#1c1c1c" stroke="#303030"/>
  <text class="section" x="1496" y="434" text-anchor="end">بيئة إنتاج</text>
  <text class="small" x="1496" y="460" text-anchor="end">مشروع واحد، بيئة واحدة</text>
  <rect x="1300" y="480" width="200" height="52" fill="#202020" stroke="#303030"/>
  <text class="chip" x="1400" y="514" text-anchor="middle" font-size="19">قاعدة بيانات مستقلة</text>
  <rect x="1080" y="480" width="200" height="52" fill="#202020" stroke="#303030"/>
  <text class="chip" x="1180" y="514" text-anchor="middle" font-size="19">Auth</text>
  <rect x="860" y="480" width="200" height="52" fill="#202020" stroke="#303030"/>
  <text class="chip" x="960" y="514" text-anchor="middle" font-size="19">REST</text>
  <rect x="860" y="556" width="640" height="76" fill="#182a22" stroke="#3ecf8e"/>
  <text class="chip" x="1470" y="590" text-anchor="end" font-size="21">ستوديو سوبابيز الأصلي</text>
  <text class="small" x="1470" y="618" text-anchor="end" font-size="16">هو سطح الإدارة كاملًا داخل البيئة</text>

  <!-- environment B -->
  <rect x="80" y="392" width="680" height="256" fill="#1c1c1c" stroke="#303030"/>
  <text class="section" x="736" y="434" text-anchor="end">بيئة تجارب اختيارية</text>
  <text class="small" x="736" y="460" text-anchor="end">نفس الشكل، بمعزل تام</text>
  <rect x="540" y="480" width="200" height="52" fill="#202020" stroke="#303030"/>
  <text class="chip" x="640" y="514" text-anchor="middle" font-size="19">قاعدة بيانات مستقلة</text>
  <rect x="320" y="480" width="200" height="52" fill="#202020" stroke="#303030"/>
  <text class="chip" x="420" y="514" text-anchor="middle" font-size="19">Auth</text>
  <rect x="100" y="480" width="200" height="52" fill="#202020" stroke="#303030"/>
  <text class="chip" x="200" y="514" text-anchor="middle" font-size="19">REST</text>
  <rect x="100" y="556" width="640" height="76" fill="#182a22" stroke="#3ecf8e"/>
  <text class="chip" x="710" y="590" text-anchor="end" font-size="21">ستوديو سوبابيز الأصلي</text>
  <text class="small" x="710" y="618" text-anchor="end" font-size="16">هو سطح الإدارة كاملًا داخل البيئة</text>

  <!-- shared band -->
  <rect x="80" y="688" width="1440" height="132" fill="#1c1c1c" stroke="#303030" stroke-dasharray="6 6"/>
  <text class="section" x="1496" y="730" text-anchor="end">مشترك داخل التنصيب</text>
  <text class="small" x="1496" y="756" text-anchor="end">حدّ فشل واحد، ولا يعبر أي بيئة إلى غيرها</text>
  <rect x="1052" y="778" width="252" height="30" fill="none" stroke="#494949"/>
  <text class="chip" x="1178" y="800" text-anchor="middle" font-size="18">PostgreSQL</text>
  <rect x="784" y="778" width="252" height="30" fill="none" stroke="#494949"/>
  <text class="chip" x="910" y="800" text-anchor="middle" font-size="18">تخزين متعدد المستأجرين</text>
  <rect x="516" y="778" width="252" height="30" fill="none" stroke="#494949"/>
  <text class="chip" x="642" y="800" text-anchor="middle" font-size="18">بوابة واتصالات</text>

  <!-- notes -->
  <rect x="80" y="852" width="6" height="72" fill="#e4bc6f"/>
  <text class="note" x="1496" y="884" text-anchor="end">ستوديو سوبابيز غير مُدمج بعد: هذه الصورة تصف تصميمًا معتمدًا، وليست نظامًا منفذًا.</text>
  <text class="note" x="1496" y="914" text-anchor="end">كل بيئة لها قاعدتها وتسجيلاتها الخاصة، وستوديو بيئة لا يقرأ بيانات بيئة أخرى.</text>

  <text class="foot latin" x="1520" y="972" text-anchor="end">sbarbase</text>
  <text class="foot" x="80" y="972" text-anchor="start">تصميم مقترح، وليس نظامًا منفذًا</text>
</svg>