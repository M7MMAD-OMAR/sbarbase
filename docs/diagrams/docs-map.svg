<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344" role="img" aria-labelledby="docsmae-t docsmae-d" xml:lang="en">
  <title id="docsmae-t">Where to read what</title>
  <desc id="docsmae-d">Four sections, each with one purpose. Explain: why it works this way. Guides: how to do something. Reference: facts to look up, including status and the glossary. Decisions: each choice, its alternative and when to reconsider it. Below them sits the engineering notebook, the dated notes written while building each mechanism, which the explain pages link to when you want to go deeper.</desc>
  <defs><marker id="docsmae-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="docsmae-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="344" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="24" y="34" font-size="16" font-weight="700" text-anchor="start">Where to read what</text>
  <text x="24" y="58" font-size="12.5" fill="#5B5465" text-anchor="start">New here? Start with explain/why.md</text>
  <rect x="24" y="76" width="204" height="150" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="126" y="104" font-size="15" font-weight="700">explain</text>
  <text x="126" y="126" font-size="12.5" font-weight="600" fill="#146B5C">why it works this way</text>
  <text x="126" y="160" font-size="12.5">why, architecture,</text>
  <text x="126" y="180" font-size="12.5">hierarchy, trust,</text>
  <text x="126" y="200" font-size="12.5">recovery, provisioning</text>
  <rect x="240" y="76" width="204" height="150" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="342" y="104" font-size="15" font-weight="700">guides</text>
  <text x="342" y="126" font-size="12.5" font-weight="600" fill="#A8412A">how to do something</text>
  <text x="342" y="160" font-size="12.5">quickstart, server,</text>
  <text x="342" y="180" font-size="12.5">operator setup, backup,</text>
  <text x="342" y="200" font-size="12.5">upgrades</text>
  <rect x="456" y="76" width="204" height="150" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="558" y="104" font-size="15" font-weight="700">reference</text>
  <text x="558" y="126" font-size="12.5" font-weight="600" fill="#A8412A">facts to look up</text>
  <text x="558" y="160" font-size="12.5">status: what works,</text>
  <text x="558" y="180" font-size="12.5">glossary, configuration,</text>
  <text x="558" y="200" font-size="12.5">API, readiness</text>
  <rect x="672" y="76" width="204" height="150" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="774" y="104" font-size="15" font-weight="700">decisions</text>
  <text x="774" y="126" font-size="12.5" font-weight="600" fill="#A8412A">why this design</text>
  <text x="774" y="160" font-size="12.5">each choice,</text>
  <text x="774" y="180" font-size="12.5">its alternative, and when</text>
  <text x="774" y="200" font-size="12.5">to reconsider it</text>
  <rect x="24" y="250" width="852" height="74" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="274" font-size="13" font-weight="700">go deeper: the engineering notebook (English only)</text>
  <text x="450" y="296" font-size="12.5">dated notes written while building each mechanism: designs, crash tests, reviews, plans, checkpoints</text>
  <text x="450" y="314" font-size="12" fill="#5B5465">also kept alongside: evidence (probe JSON), diagrams, the console design record</text>
  <path d="M450 226 L450 248" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#docsmae-i)"/>
  </g>
