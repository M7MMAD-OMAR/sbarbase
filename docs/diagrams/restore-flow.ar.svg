<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="restora-t restora-d" xml:lang="ar" direction="rtl">
  <title id="restora-t">استعادة بيئة واحدة: تحقق قبل التحويل</title>
  <desc id="restora-d">خمس خطوات. 1، إيقاف الكتابة: تضع البوابة البيئة في الصيانة وتُعطَّل حسابات خدمتها، وتُحفظ حالتها في سجل العملية. 2، تصدير مشفّر للقاعدة والحسابات والملفات ومفاتيح التوقيع، ثم تُغلق قاعدة المصدر. 3، استعادة إلى محرك جديد مثبّت الإصدار بشبكته ووحدة تخزينه. 4، التحقق من الصفوف والبصمات والأدوار والدخول الأصلي وRLS ورابط موقّع قديم. 5، تحويل سجل التوجيه إلى المحرك الجديد بعد فحص المراجعة. إن فشل التحقق تبقى بيانات المصدر سليمة لكنها مسيّجة، ويعيد المشغّل فتحها عمدًا. التصدير يوقف عملية Storage المشتركة وبقية خدمات المصدر، فتتوقف كل البيئات على ذلك المحرك حتى يُعاد تشغيلها. النسخ المجدولة وخارج الخادم مخططة وغير مبنية.</desc>
  <defs><marker id="restora-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="restora-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="480" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="876" y="34" font-size="16" font-weight="700" text-anchor="start">استعادة بيئة واحدة: تحقق قبل التحويل</text>
  <rect x="716" y="62" width="160" height="110" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <circle cx="856" cy="82" r="11" fill="#2A2632"/>
  <text x="856" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">1</text>
  <text x="838" y="87" font-size="13" font-weight="700" text-anchor="start">إيقاف الكتابة</text>
  <text x="796" y="116" font-size="12">صيانة: 503</text>
  <text x="796" y="134" font-size="12">حسابات الخدمة معطلة</text>
  <text x="796" y="152" font-size="12">وحالتها في سجل</text>
  <path d="M716 117 L704 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#restora-i)"/>
  <rect x="542" y="62" width="160" height="110" rx="8" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <circle cx="682" cy="82" r="11" fill="#2A2632"/>
  <text x="682" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">2</text>
  <text x="664" y="87" font-size="13" font-weight="700" text-anchor="start">تصدير مشفّر</text>
  <text x="622" y="116" font-size="12">القاعدة والحسابات</text>
  <text x="622" y="134" font-size="12">والملفات والمفاتيح،</text>
  <text x="622" y="152" font-size="12">ثم يُغلق المصدر</text>
  <path d="M542 117 L530 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#restora-i)"/>
  <rect x="368" y="62" width="160" height="110" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <circle cx="508" cy="82" r="11" fill="#2A2632"/>
  <text x="508" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">3</text>
  <text x="490" y="87" font-size="13" font-weight="700" text-anchor="start">استعادة</text>
  <text x="448" y="116" font-size="12">محرك جديد</text>
  <text x="448" y="134" font-size="12">مثبّت الإصدار</text>
  <text x="448" y="152" font-size="12">بشبكته ووحدة تخزينه</text>
  <path d="M368 117 L356 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#restora-i)"/>
  <rect x="194" y="62" width="160" height="110" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <circle cx="334" cy="82" r="11" fill="#2A2632"/>
  <text x="334" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">4</text>
  <text x="316" y="87" font-size="13" font-weight="700" text-anchor="start">تحقق</text>
  <text x="274" y="116" font-size="12">الصفوف والبصمات</text>
  <text x="274" y="134" font-size="12">والأدوار والدخول وRLS</text>
  <text x="274" y="152" font-size="12">ورابط موقّع قديم</text>
  <path d="M194 117 L182 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#restora-i)"/>
  <rect x="20" y="62" width="160" height="110" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <circle cx="160" cy="82" r="11" fill="#2A2632"/>
  <text x="160" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">5</text>
  <text x="142" y="87" font-size="13" font-weight="700" text-anchor="start">تحويل المسار</text>
  <text x="100" y="116" font-size="12">سجل التوجيه يشير</text>
  <text x="100" y="134" font-size="12">إلى المحرك الجديد</text>
  <text x="100" y="152" font-size="12">بعد فحص المراجعة</text>
  <path d="M274 172 L274 204" fill="none" stroke="#E06A4B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#restora-c)"/>
  <rect x="24" y="206" width="504" height="62" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="276" y="230" font-size="12.5" font-weight="700">فشل التحقق: بيانات المصدر سليمة وتبقى مسيّجة</text>
  <text x="276" y="252" font-size="12.5">يعيد المشغّل فتحها عمدًا، ولا شيء يفتحها تلقائيًا</text>
  <rect x="24" y="290" width="852" height="62" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="450" y="315" font-size="13" font-weight="700">التصدير يوقف Storage المشترك وبقية خدمات المصدر:</text>
  <text x="450" y="337" font-size="12.5">كل البيئات على ذلك المحرك تبقى متوقفة حتى يُعاد تشغيلها.</text>
  <rect x="24" y="368" width="852" height="38" rx="8" fill="#EFE9FA" stroke="#B7A2E6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="450" y="392" font-size="12.5">مخطط: نسخ احتياطية مجدولة خارج الخادم، ونسخ بيئة واحدة دون إيقاف</text>
  <text x="876" y="430" font-size="12.5" fill="#5B5465" text-anchor="start">إجراء يتطلب توقفًا، جُرّب على خادم واحد مع بيئة اختبار محفوظة.</text>
  <rect x="854" y="447" width="22" height="14" rx="3" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <text x="846" y="458" font-size="12" fill="#5B5465" text-anchor="start">ملف مشفّر</text>
  <rect x="738.4" y="447" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="730.4" y="458" font-size="12" fill="#5B5465" text-anchor="start">مشترك: يمس كل البيئات</text>
  <rect x="546.0" y="447" width="22" height="14" rx="3" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="538.0" y="458" font-size="12" fill="#5B5465" text-anchor="start">يتوقف للمشغّل</text>
  <rect x="404.8" y="447" width="22" height="14" rx="3" fill="#EFE9FA" stroke="#B7A2E6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="396.8" y="458" font-size="12" fill="#5B5465" text-anchor="start">مخطط</text>
  </g>
</svg>
