<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-labelledby="trustbe-t trustbe-d" xml:lang="en">
  <title id="trustbe-t">Who is trusted, and what is shared</title>
  <desc id="trustbe-d">App visitors are untrusted. Their browsers and mobile apps reach the server only over HTTPS through the TLS proxy, the one part facing the network, and then the gateway, which requires a publishable key. Trusted operators reach the console and control API through the same proxy with a management login, and may also use the host shell and SQL directly. Behind the proxy everything listens on loopback or internal Docker networks. Each environment has its own Auth, REST, database, logins and keys. The PostgreSQL engine and the Storage process are shared, so they are shared failure boundaries.</desc>
  <defs><marker id="trustbe-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="trustbe-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="490" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="24" y="34" font-size="16" font-weight="700" text-anchor="start">Who is trusted, and what is shared</text>
  <rect x="24" y="76" width="176" height="100" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="112" y="100" font-size="13" font-weight="700" fill="#A8412A">untrusted</text>
  <text x="112" y="122" font-size="12.5">app visitors</text>
  <text x="112" y="140" font-size="12.5">browser or mobile app</text>
  <text x="112" y="158" font-size="12.5">with a user token</text>
  <rect x="24" y="250" width="176" height="100" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="112" y="274" font-size="13" font-weight="700" fill="#146B5C">trusted</text>
  <text x="112" y="296" font-size="12.5">your operators</text>
  <text x="112" y="314" font-size="12.5">operator browser</text>
  <text x="112" y="332" font-size="12.5">host shell, SQL author</text>
  <rect x="232" y="50" width="644" height="380" rx="8" fill="none" stroke="#2A2632" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="248" y="72" font-size="13" font-weight="700" text-anchor="start">your server (host)</text>
  <text x="248" y="92" font-size="12" fill="#5B5465" text-anchor="start">behind the proxy: loopback and internal Docker networks, no published ports</text>
  <rect x="250" y="150" width="118" height="124" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="309" y="176" font-size="13" font-weight="700">TLS proxy</text>
  <text x="309" y="202" font-size="12">the only part</text>
  <text x="309" y="220" font-size="12">facing the</text>
  <text x="309" y="238" font-size="12">network</text>
  <rect x="400" y="112" width="172" height="58" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="486" y="136" font-size="13" font-weight="700">gateway</text>
  <text x="486" y="156" font-size="12">publishable key</text>
  <rect x="400" y="256" width="172" height="58" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="486" y="280" font-size="12.5" font-weight="700">console, control API</text>
  <text x="486" y="300" font-size="12">management login</text>
  <rect x="590" y="108" width="270" height="50" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="725" y="128" font-size="12.5" font-weight="700">environment A</text>
  <text x="725" y="147" font-size="11.5">own Auth, REST, database, logins, keys</text>
  <rect x="590" y="168" width="270" height="50" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="725" y="188" font-size="12.5" font-weight="700">environment B</text>
  <text x="725" y="207" font-size="11.5">own Auth, REST, database, logins, keys</text>
  <rect x="590" y="248" width="128" height="66" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="654" y="272" font-size="12.5" font-weight="700">PostgreSQL</text>
  <text x="654" y="294" font-size="12">shared by all</text>
  <rect x="732" y="248" width="128" height="66" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="796" y="272" font-size="12.5" font-weight="700">Storage</text>
  <text x="796" y="294" font-size="12">every tenant's files</text>
  <path d="M200 126 C226 126 222 180 248 184" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trustbe-i)"/>
  <path d="M200 300 C226 300 222 246 248 242" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trustbe-i)"/>
  <text x="254" y="140" font-size="11" fill="#5B5465" text-anchor="start">HTTPS</text>
  <text x="254" y="292" font-size="11" fill="#5B5465" text-anchor="start">HTTPS</text>
  <path d="M368 190 C384 190 382 141 398 141" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trustbe-i)"/>
  <path d="M368 236 C384 236 382 285 398 285" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trustbe-i)"/>
  <path d="M572 132 L588 132" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trustbe-i)"/>
  <path d="M572 152 C582 152 578 192 588 192" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trustbe-i)"/>
  <path d="M725 218 L725 234 L654 234 L654 246" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trustbe-i)"/>
  <text x="736" y="238" font-size="11" fill="#5B5465" text-anchor="start">own logins</text>
  <path d="M572 162 L580 162 L580 340 L796 340 L796 316" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#trustbe-i)"/>
  <text x="668" y="356" font-size="11.5" fill="#5B5465">files, tenant header</text>
  <path d="M112 350 L112 406 L654 406 L654 316" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" marker-end="url(#trustbe-i)"/>
  <text x="380" y="400" font-size="11.5" fill="#5B5465">direct host and SQL access</text>
  <text x="24" y="452" font-size="12.5" text-anchor="start">Shared parts: a failure there reaches every environment. Not built for mutually hostile customers.</text>
  <rect x="24" y="461" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="54" y="472" font-size="12" fill="#5B5465" text-anchor="start">shared</text>
  <rect x="120.4" y="461" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="150.4" y="472" font-size="12" fill="#5B5465" text-anchor="start">one per environment, or trusted</text>
  <rect x="376.79999999999995" y="461" width="22" height="14" rx="3" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="406.79999999999995" y="472" font-size="12" fill="#5B5465" text-anchor="start">untrusted</text>
  </g>
</svg>
