  <text x="275" y="94" font-size="12.5" font-weight="700">Auth وREST: البيئة أ</text>
  <text x="275" y="118" font-size="12">حاوياتها الخاصة:</text>
  <text x="275" y="135" font-size="12">حدود للمعالج والذاكرة</text>
