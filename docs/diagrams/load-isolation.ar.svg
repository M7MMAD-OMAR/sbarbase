  <text x="669" y="144" font-size="12" fill="#A8412A" text-anchor="start">أ: حصتها 8، و14 مستعارة</text>
  <text x="669" y="163" font-size="12" fill="#146B5C" text-anchor="start">ب: 2 مستخدمة، ضمن حصتها 8</text>
  <text x="669" y="182" font-size="12" text-anchor="start">الثمانية الأخيرة: محجوزة لأي حصة</text>
  <text x="669" y="214" font-size="12" font-weight="700" fill="#A8412A" text-anchor="start">أ تطلب المزيد: 429، أعد المحاولة</text>
  <text x="669" y="236" font-size="12" font-weight="700" fill="#146B5C" text-anchor="start">ب تطلب: تُقبل فورًا</text>
  <text x="669" y="264" font-size="11.5" fill="#5B5465" text-anchor="start">أ لا تتجاوز 24. وحين تحتاج ب مكانًا</text>
  <text x="669" y="281" font-size="11.5" fill="#5B5465" text-anchor="start">لا تستعير أ جديدًا، وتعود أماكنها</text>
  <text x="669" y="298" font-size="11.5" fill="#5B5465" text-anchor="start">المستعارة كلما انتهى طلب.</text>
  <text x="669" y="334" font-size="11.5" font-weight="700" text-anchor="start">15 دقيقة هكذا: تنبيه واحد للمشغّل</text>
