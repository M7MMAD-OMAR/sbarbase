  <text x="450" y="396" font-size="13.5" font-weight="700">النتيجة: البيئة أ محصورة في حدودها، والبيئة ب ما زالت تُخدم.</text>
  <text x="450" y="420" font-size="12">في الفحوص المحلية رُفض الطلب التاسع وبقيت البيئة المجاورة تجيب، ولم يعطّل حساب مشبع جارته.</text>
  <text x="876" y="462" font-size="12" fill="#5B5465" text-anchor="start">غير معايرة تحت حمل مستمر: المعالج والذاكرة والقرص داخل محرك PostgreSQL الواحد تبقى مشتركة، فقد يبطئ جار ثقيل البقية.</text>
