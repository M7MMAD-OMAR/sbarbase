<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="provise-t provise-d" xml:lang="en">
  <title id="provise-t">Provisioning: record first, act, then settle</title>
  <desc id="provise-d">Five steps. The control API queues a job in the catalog. One worker holding an exclusive lock claims it. Before any effect, the worker writes an effect receipt naming the claim, attempt and operation token and flushes it to disk. The fenced effect runs: SQL, connection rules and services, under a guardian with a deadline. The outcome is recorded in the catalog with the job, then the receipt is consumed. After a crash, a completed receipt is settled, an interruption proven to precede any change is requeued a bounded number of times, and an unknown outcome blocks startup and replay until an operator reconciles it.</desc>
  <defs><marker id="provise-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="provise-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="440" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="24" y="34" font-size="16" font-weight="700" text-anchor="start">Provisioning: record first, act, then settle</text>
  <rect x="24" y="62" width="160" height="110" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <circle cx="44" cy="82" r="11" fill="#2A2632"/>
  <text x="44" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">1</text>
  <text x="62" y="87" font-size="13" font-weight="700" text-anchor="start">queue a job</text>
  <text x="104" y="116" font-size="12">control API writes it</text>
  <text x="104" y="134" font-size="12">to the catalog</text>
  <path d="M184 117 L196 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provise-i)"/>
  <rect x="198" y="62" width="160" height="110" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <circle cx="218" cy="82" r="11" fill="#2A2632"/>
  <text x="218" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">2</text>
  <text x="236" y="87" font-size="13" font-weight="700" text-anchor="start">claim it</text>
  <text x="278" y="116" font-size="12">one worker holds</text>
  <text x="278" y="134" font-size="12">an exclusive lock</text>
  <path d="M358 117 L370 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provise-i)"/>
  <rect x="372" y="62" width="160" height="110" rx="8" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <circle cx="392" cy="82" r="11" fill="#2A2632"/>
  <text x="392" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">3</text>
  <text x="410" y="87" font-size="13" font-weight="700" text-anchor="start">write a receipt</text>
  <text x="452" y="116" font-size="12">claim, attempt, token;</text>
  <text x="452" y="134" font-size="12">flushed to disk</text>
  <path d="M532 117 L544 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provise-i)"/>
  <rect x="546" y="62" width="160" height="110" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <circle cx="566" cy="82" r="11" fill="#2A2632"/>
  <text x="566" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">4</text>
  <text x="584" y="87" font-size="13" font-weight="700" text-anchor="start">fenced effect</text>
  <text x="626" y="116" font-size="12">SQL, connection rules,</text>
  <text x="626" y="134" font-size="12">services; guardian</text>
  <text x="626" y="152" font-size="12">with a deadline</text>
  <path d="M706 117 L718 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provise-i)"/>
  <rect x="720" y="62" width="160" height="110" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <circle cx="740" cy="82" r="11" fill="#2A2632"/>
  <text x="740" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">5</text>
  <text x="758" y="87" font-size="13" font-weight="700" text-anchor="start">record outcome</text>
  <text x="800" y="116" font-size="12">in the catalog with</text>
  <text x="800" y="134" font-size="12">the job, then consume</text>
  <text x="800" y="152" font-size="12">the receipt</text>
  <text x="24" y="214" font-size="13" font-weight="700" text-anchor="start">After a crash, on restart</text>
  <path d="M452 172 L452 226" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M160 226 L740 226" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 226 L160 244" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provise-i)"/>
  <rect x="24" y="246" width="272" height="84" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="160" y="272" font-size="13" font-weight="700">completed receipt</text>
  <text x="160" y="296" font-size="12.5">settled against the catalog</text>
  <path d="M450 226 L450 244" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provise-i)"/>
  <rect x="314" y="246" width="272" height="84" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="450" y="272" font-size="13" font-weight="700">stopped before any change</text>
  <text x="450" y="296" font-size="12.5">proven, so requeued a bounded</text>
  <text x="450" y="314" font-size="12.5">number of times</text>
  <path d="M740 226 L740 244" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provise-i)"/>
  <rect x="604" y="246" width="272" height="84" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="740" y="272" font-size="13" font-weight="700">unknown outcome</text>
  <text x="740" y="296" font-size="12.5">blocks startup and replay;</text>
  <text x="740" y="314" font-size="12.5">an operator reconciles it</text>
  <text x="24" y="368" font-size="12.5" text-anchor="start">Never delete a pending receipt, journal, generation pin or tombstone to get past a refusal.</text>
  <text x="24" y="390" font-size="12.5" fill="#5B5465" text-anchor="start">Crash tests cover named checkpoints on disposable fixtures, not every possible crash.</text>
  <rect x="24" y="413" width="22" height="14" rx="3" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <text x="54" y="424" font-size="12" fill="#5B5465" text-anchor="start">durable record</text>
  <rect x="171.60000000000002" y="413" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="201.60000000000002" y="424" font-size="12" fill="#5B5465" text-anchor="start">touches the shared engine</text>
  <rect x="389.6" y="413" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="419.6" y="424" font-size="12" fill="#5B5465" text-anchor="start">settled</text>
  <rect x="492.40000000000003" y="413" width="22" height="14" rx="3" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="522.4000000000001" y="424" font-size="12" fill="#5B5465" text-anchor="start">stops for an operator</text>
  </g>
</svg>
