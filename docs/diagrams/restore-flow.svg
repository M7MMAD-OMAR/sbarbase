<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="rf-title rf-desc">
  <title id="rf-title">Restoring one environment: verify on an independent engine before switching</title>
  <desc id="rf-desc">Four steps. 1, stop writes: the gateway puts the environment in maintenance and its service logins are disabled. 2, encrypted export of the database, logins, files and signing keys, after which the source database is closed. 3, restore into a fresh pinned engine on the same host and verify rows, row-level security, the original login and an old signed URL. 4, switch the routing record to the new engine. If verification fails, the source data is untouched but stays fenced, and an operator reopens it deliberately; nothing reopens it automatically. Exporting stops the shared Storage process and the other services of the source, so every environment on that engine is offline until they are restarted.</desc>
  <defs>
    <filter id="rf-wob" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="wobbled"/>
      <feDropShadow in="wobbled" dx="0" dy="2" stdDeviation="1.3" flood-color="#2B1E10" flood-opacity="0.22"/>
    </filter>
    <marker id="rf-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="rf-ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#FFFBF1"/>

  <g font-family="'Marker Felt','Comic Neue','Segoe Print','Patrick Hand',cursive,sans-serif" font-size="13" fill="#2A2632" text-anchor="middle">
    <text x="20" y="30" font-size="15" font-weight="700" text-anchor="start">Restore one environment: verify before switching</text>

    <g filter="url(#rf-wob)">
      <rect x="20" y="66" width="170" height="136" rx="7" fill="#FFFDF7" stroke="#2A2632" stroke-width="1.6" transform="rotate(-1.2 105 134)"/>
      <rect x="250" y="66" width="170" height="136" rx="7" fill="#FFFDF7" stroke="#2A2632" stroke-width="1.6" transform="rotate(1 335 134)"/>
      <rect x="480" y="66" width="170" height="136" rx="7" fill="#FFFDF7" stroke="#2A2632" stroke-width="1.6" transform="rotate(-0.8 565 134)"/>
      <rect x="710" y="66" width="170" height="136" rx="7" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.6" transform="rotate(1.2 795 134)"/>
      <circle cx="105" cy="66" r="15" fill="#F0C23E" stroke="#2A2632" stroke-width="1.5"/>
      <circle cx="335" cy="66" r="15" fill="#F0C23E" stroke="#2A2632" stroke-width="1.5"/>
      <circle cx="565" cy="66" r="15" fill="#F0C23E" stroke="#2A2632" stroke-width="1.5"/>
      <circle cx="795" cy="66" r="15" fill="#F0C23E" stroke="#2A2632" stroke-width="1.5"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="105" y="71">1</text><text x="335" y="71">2</text><text x="565" y="71">3</text><text x="795" y="71">4</text>
    </g>

    <text x="105" y="106" font-weight="700">stop writes</text>
    <g font-size="12">
      <text x="105" y="130">gateway maintenance</text>
      <text x="105" y="148">(apps get 503)</text>
      <text x="105" y="172">service logins off</text>
      <text x="105" y="188">(database fence)</text>
    </g>

    <text x="335" y="106" font-weight="700">encrypted export</text>
    <g font-size="12">
      <text x="335" y="130">database and logins,</text>
      <text x="335" y="146">files, signing keys</text>
      <text x="335" y="170">then the source</text>
      <text x="335" y="186">database is closed</text>
    </g>

    <text x="565" y="106" font-weight="700">restore and verify</text>
    <g font-size="12">
      <text x="565" y="130">fresh pinned engine,</text>
      <text x="565" y="146">independent of the source</text>
      <text x="565" y="170">check rows, RLS, login,</text>
      <text x="565" y="186">an old signed URL</text>
    </g>

    <text x="795" y="106" font-weight="700">switch the route</text>
    <g font-size="12">
      <text x="795" y="130">routing record points</text>
      <text x="795" y="146">at the new engine</text>
      <text x="795" y="170">revision checked,</text>
      <text x="795" y="186">then routing resumes</text>
    </g>

    <g stroke="#2A2632" stroke-width="1.6" fill="none" marker-end="url(#rf-ah)">
      <path d="M194 136 C210 132 228 140 246 136"/>
      <path d="M424 136 C440 132 458 140 476 136"/>
      <path d="M654 136 C670 132 688 140 706 136"/>
    </g>
    <text x="220" y="124" font-size="12">fenced</text>
    <text x="450" y="124" font-size="12">bundle</text>
    <text x="680" y="124" font-size="12">verified</text>

    <!-- failure return -->
    <path d="M565 206 C566 256 470 264 335 264 C200 264 106 256 105 210" stroke="#E06A4B" stroke-width="1.6" fill="none" stroke-dasharray="6 5" marker-end="url(#rf-ahc)"/>
    <text x="335" y="288" font-size="13" font-weight="700" fill="#B2472C">verification fails: source data untouched, still fenced</text>
    <text x="335" y="306" font-size="12" fill="#B2472C">an operator reopens it deliberately; nothing reopens it automatically</text>

    <!-- shared storage warning -->
    <g filter="url(#rf-wob)">
      <rect x="20" y="330" width="860" height="62" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
    </g>
    <text x="450" y="355" font-weight="700">exporting stops shared Storage and the source's other services</text>
    <text x="450" y="376" font-size="12.5">every environment on that engine is offline until its neighbours are restarted</text>

    <text x="450" y="420" font-size="12" fill="#5B5465">a downtime procedure, exercised on one host with a retained test fixture; no off-host copies yet</text>
  </g>
</svg>
