<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="keyisoe-t keyisoe-d" xml:lang="en">
  <title id="keyisoe-t">Project A's key cannot reach project B's data</title>
  <desc id="keyisoe-d">Three rows. First, a request on environment A's path with A's publishable key: the gateway finds the key among A's stored key hashes and forwards it to A's own REST, which logs in to database A with A's own login. Second, the same key on environment B's path: the key is not one of B's keys, so the gateway answers 401 and forwards nothing. A user token signed by A's Auth is also invalid at B, whose Auth has its own signing secret. Third, underneath: even a service login that tried the wrong database is refused by PostgreSQL, because the connection rules name exact login and database pairs and CONNECT on each database is granted only to its own logins.</desc>
  <defs><marker id="keyisoe-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="keyisoe-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="470" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="24" y="34" font-size="16" font-weight="700" text-anchor="start">Project A's key cannot reach project B's data</text>
  <rect x="700" y="60" width="176" height="326" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="788" y="84" font-size="12.5" font-weight="700">PostgreSQL engine</text>
  <text x="788" y="102" font-size="12">shared</text>
  <rect x="716" y="116" width="144" height="70" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="788" y="142" font-size="12.5">database A</text>
  <text x="788" y="162" font-size="12.5">A's logins only</text>
  <rect x="716" y="290" width="144" height="70" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="788" y="316" font-size="12.5">database B</text>
  <text x="788" y="336" font-size="12.5">B's logins only</text>
  <text x="24" y="70" font-size="12" font-weight="700" fill="#146B5C" text-anchor="start">allowed</text>
  <text x="24" y="196" font-size="12" font-weight="700" fill="#A8412A" text-anchor="start">refused at the gateway</text>
  <text x="24" y="300" font-size="12" font-weight="700" fill="#A8412A" text-anchor="start">refused in PostgreSQL</text>
  <rect x="24" y="80" width="150" height="60" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="99" y="104" font-size="12.5" font-weight="600">app with A's key</text>
  <text x="99" y="124" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">/envA/rest/v1</text>
  <rect x="210" y="80" width="190" height="60" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="305" y="104" font-size="13" font-weight="700">gateway</text>
  <text x="305" y="124" font-size="12">key is one of A's hashes</text>
  <rect x="436" y="80" width="160" height="60" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="516" y="104" font-size="13" font-weight="600">REST, env A</text>
  <text x="516" y="124" font-size="11.5">login: A's REST login</text>
  <path d="M174 110 L208 110" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#keyisoe-i)"/>
  <path d="M400 110 L434 110" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#keyisoe-i)"/>
  <path d="M596 110 C650 110 660 151 714 151" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#keyisoe-i)"/>
  <rect x="24" y="206" width="150" height="60" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="99" y="230" font-size="12.5" font-weight="600">app with A's key</text>
  <text x="99" y="250" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">/envB/rest/v1</text>
  <rect x="210" y="206" width="190" height="60" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="305" y="230" font-size="13" font-weight="700">gateway</text>
  <text x="305" y="250" font-size="12">not one of B's keys</text>
  <rect x="436" y="206" width="160" height="60" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="516" y="230" font-size="12.5" font-weight="700">401, nothing forwarded</text>
  <text x="516" y="250" font-size="12">B's data never reached</text>
  <path d="M174 236 L208 236" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#keyisoe-i)"/>
  <path d="M400 236 L434 236" fill="none" stroke="#E06A4B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#keyisoe-c)"/>
  <text x="210" y="164" font-size="12" fill="#5B5465" text-anchor="start">A user token from A's Auth is also invalid at B: each Auth has its own signing secret.</text>
  <rect x="24" y="310" width="150" height="60" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="99" y="334" font-size="12.5" font-weight="600">A's REST login</text>
  <text x="99" y="354" font-size="12">tries database B</text>
  <rect x="210" y="310" width="386" height="60" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="403" y="334" font-size="12.5" font-weight="700">connection rules: one login, one database</text>
  <text x="403" y="354" font-size="12">CONNECT is granted only to its own logins</text>
  <path d="M174 340 L208 340" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#keyisoe-i)"/>
  <path d="M596 340 C650 340 660 325 700 325" fill="none" stroke="#E06A4B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#keyisoe-c)"/>
  <text x="648" y="318" font-size="11.5" fill="#A8412A">refused</text>
  <text x="24" y="414" font-size="12" fill="#5B5465" text-anchor="start">Each environment also has its own Storage tenant and signing keys. Trusted operators and SQL authors are outside this boundary.</text>
  <rect x="24" y="435" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="54" y="446" font-size="12" fill="#5B5465" text-anchor="start">one per environment</text>
  <rect x="203.60000000000002" y="435" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="233.60000000000002" y="446" font-size="12" fill="#5B5465" text-anchor="start">shared</text>
  <rect x="300.0" y="435" width="22" height="14" rx="3" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="330.0" y="446" font-size="12" fill="#5B5465" text-anchor="start">environment database</text>
  <rect x="486.0" y="435" width="22" height="14" rx="3" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="516.0" y="446" font-size="12" fill="#5B5465" text-anchor="start">refused</text>
  </g>
</svg>
