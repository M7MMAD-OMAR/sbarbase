<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="op-title op-desc">
  <title id="op-title">Who owns an environment is recorded separately from where it runs</title>
  <desc id="op-desc">Left: the ownership tree in the catalog. Your server holds clients, each client owns projects, and each project has environments: client Acme owns the shop project with production and staging and the blog project with production; client Beta owns the app project with production. Right: placement on one server. A shared PostgreSQL engine holds the shop and blog databases, and a restored engine on the same server holds app production, moved there after a restore. Moving an environment changes only its routing record; its owner, identifiers and keys stay the same. A second server is planned, not built.</desc>
  <defs>
    <filter id="op-wob" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="wobbled"/>
      <feDropShadow in="wobbled" dx="0" dy="2" stdDeviation="1.3" flood-color="#2B1E10" flood-opacity="0.22"/>
    </filter>
    <marker id="op-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="op-ahl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#7E68B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#FFFBF1"/>

  <g font-family="'Marker Felt','Comic Neue','Segoe Print','Patrick Hand',cursive,sans-serif" font-size="13" fill="#2A2632" text-anchor="middle">

    <!-- LEFT: ownership tree -->
    <text x="204" y="30" font-size="15" font-weight="700">Who owns it (catalog)</text>
    <g stroke="#2A2632" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M262 82 C250 96 190 98 180 112"/>
      <path d="M262 82 C276 96 334 98 340 112"/>
      <path d="M180 146 C170 160 116 162 110 176"/>
      <path d="M180 146 C194 160 246 162 251 176"/>
      <path d="M340 146 C342 158 344 164 345 176"/>
      <path d="M110 210 C100 224 66 226 63 240"/>
      <path d="M110 210 C120 224 152 226 157 240"/>
      <path d="M251 210 C250 222 252 230 251 240"/>
      <path d="M345 210 C346 222 344 230 345 240"/>
    </g>
    <g filter="url(#op-wob)" stroke="#2A2632">
      <rect x="192" y="48" width="140" height="34" rx="6" fill="#FFFDF7" stroke-width="1.6"/>
      <rect x="115" y="112" width="130" height="34" rx="6" fill="#B7A2E6" stroke-width="1.3" transform="rotate(-1 180 129)"/>
      <rect x="290" y="112" width="100" height="34" rx="6" fill="#B7A2E6" stroke-width="1.3" transform="rotate(1 340 129)"/>
      <rect x="55" y="176" width="110" height="34" rx="6" fill="#F7D3D4" stroke-width="1.3"/>
      <rect x="203" y="176" width="96" height="34" rx="6" fill="#F7D3D4" stroke-width="1.3"/>
      <rect x="305" y="176" width="80" height="34" rx="6" fill="#F7D3D4" stroke-width="1.3"/>
      <rect x="20" y="240" width="86" height="44" rx="6" fill="#BFE3D8" stroke-width="1.3"/>
      <rect x="114" y="240" width="86" height="44" rx="6" fill="#BFE3D8" stroke-width="1.3"/>
      <rect x="208" y="240" width="86" height="44" rx="6" fill="#BFE3D8" stroke-width="1.3"/>
      <rect x="302" y="240" width="86" height="44" rx="6" fill="#BFE3D8" stroke-width="1.3"/>
    </g>
    <text x="262" y="70">your server</text>
    <text x="180" y="134">client: Acme</text>
    <text x="340" y="134">client: Beta</text>
    <text x="110" y="198">project: shop</text>
    <text x="251" y="198">project: blog</text>
    <text x="345" y="198">project: app</text>
    <g font-size="12">
      <text x="63" y="258">production</text><text x="63" y="274">shop</text>
      <text x="157" y="258">staging</text><text x="157" y="274">shop</text>
      <text x="251" y="258">production</text><text x="251" y="274">blog</text>
      <text x="345" y="258">production</text><text x="345" y="274">app</text>
    </g>
    <text x="204" y="316" font-size="12" fill="#5B5465">the environment is the unit of</text>
    <text x="204" y="332" font-size="12" fill="#5B5465">isolation, move and restore</text>
    <text x="204" y="366" font-size="12" fill="#5B5465">in the code: client = organization,</text>
    <text x="204" y="382" font-size="12" fill="#5B5465">your server = installation</text>

    <!-- divider -->
    <line x1="424" y1="44" x2="424" y2="410" stroke="#2A2632" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 6"/>

    <!-- RIGHT: placement -->
    <text x="670" y="30" font-size="15" font-weight="700">Where it runs (routing records)</text>
    <g filter="url(#op-wob)">
      <rect x="450" y="46" width="440" height="244" rx="10" fill="#FFFDF7" stroke="#2A2632" stroke-width="1.6"/>
      <rect x="464" y="86" width="200" height="190" rx="9" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
      <rect x="690" y="86" width="186" height="190" rx="9" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
      <rect x="482" y="120" width="164" height="30" rx="5" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="482" y="158" width="164" height="30" rx="5" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="482" y="196" width="164" height="30" rx="5" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="482" y="234" width="164" height="30" rx="5" fill="#E9E1D0" stroke="#2A2632" stroke-width="1.1"/>
      <rect x="708" y="120" width="150" height="30" rx="5" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3" transform="rotate(-1 783 135)"/>
    </g>
    <text x="670" y="68" font-weight="700">your server (one host)</text>
    <text x="564" y="108" font-size="12.5">PostgreSQL engine</text>
    <text x="783" y="108" font-size="12.5">restored engine</text>
    <text x="564" y="140">shop production</text>
    <text x="564" y="178">shop staging</text>
    <text x="564" y="216">blog production</text>
    <text x="564" y="254" font-size="12" fill="#5B5465">app production, closed</text>
    <text x="783" y="140">app production</text>
    <path d="M648 250 C700 250 700 170 740 154" stroke="#2A2632" stroke-width="1.6" fill="none" marker-end="url(#op-ah)"/>
    <text x="783" y="200" font-size="12">moved after a restore;</text>
    <text x="783" y="216" font-size="12">its routing record</text>
    <text x="783" y="232" font-size="12">now points here</text>
    <text x="670" y="312" font-size="13" font-weight="700">move an environment, owner unchanged</text>
    <text x="670" y="330" font-size="12" fill="#5B5465">identifiers, keys and client stay the same</text>

    <!-- planned second server -->
    <g filter="url(#op-wob)">
      <rect x="560" y="352" width="330" height="56" rx="9" fill="#EFE8F9" stroke="#7E68B8" stroke-width="1.5" stroke-dasharray="6 5"/>
    </g>
    <path d="M500 292 C496 330 520 376 554 380" stroke="#7E68B8" stroke-width="1.5" fill="none" stroke-dasharray="5 5" marker-end="url(#op-ahl)"/>
    <text x="725" y="376" font-weight="700">second server (planned)</text>
    <text x="725" y="396" font-size="12">no multi-server coordination yet</text>
  </g>
</svg>
