<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="hierare-t hierare-d" xml:lang="en">
  <title id="hierare-t">Clients, projects and environments on one server</title>
  <desc id="hierare-d">Left, the ownership tree in the catalog: Client A owns the Shop project with production and staging environments, and Client B owns the Blog project with a production environment. Right, where they run: on your server one shared PostgreSQL engine holds a separate database for each environment. A routing record links each environment to its placement, so moving an environment changes only that record; its owner, identifiers and keys stay the same. All of it runs on one ordinary server.</desc>
  <defs><marker id="hierare-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hierare-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="470" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="24" y="34" font-size="16" font-weight="700" text-anchor="start">Clients, projects and environments on one server</text>
  <text x="24" y="72" font-size="12.5" font-weight="600" fill="#5B5465" text-anchor="start">Who owns it (catalog)</text>
  <text x="496" y="72" font-size="12.5" font-weight="600" fill="#5B5465" text-anchor="start">Where it runs (routing records)</text>
  <rect x="24" y="110" width="124" height="44" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="86" y="137" font-size="13" font-weight="700">Client A</text>
  <rect x="178" y="110" width="132" height="44" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="244" y="137" font-size="13">project: Shop</text>
  <path d="M148 132 L178 132" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="250" width="124" height="44" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="86" y="277" font-size="13" font-weight="700">Client B</text>
  <rect x="178" y="250" width="132" height="44" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="244" y="277" font-size="13">project: Blog</text>
  <path d="M148 272 L178 272" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="340" y="86" width="124" height="40" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="402" y="111" font-size="13">production</text>
  <rect x="340" y="138" width="124" height="40" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="402" y="163" font-size="13">staging</text>
  <rect x="340" y="252" width="124" height="40" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="402" y="277" font-size="13">production</text>
  <path d="M310 132 C325 132 325 106 340 106" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M310 132 C325 132 325 158 340 158" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M310 272 L340 272" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="346" font-size="12.5" text-anchor="start">The environment is the unit of isolation,</text>
  <text x="24" y="363" font-size="12.5" text-anchor="start">backup, move and restore.</text>
  <text x="24" y="384" font-size="12" fill="#5B5465" text-anchor="start">In the code: client = organization,</text>
  <text x="24" y="400" font-size="12" fill="#5B5465" text-anchor="start">your server = installation.</text>
  <rect x="496" y="86" width="380" height="236" rx="8" fill="none" stroke="#2A2632" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="512" y="108" font-size="13" font-weight="700" text-anchor="start">Your server</text>
  <rect x="512" y="120" width="348" height="186" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="686" y="142" font-size="13" font-weight="700">one shared PostgreSQL engine</text>
  <rect x="532" y="156" width="308" height="38" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="686" y="180" font-size="13">database: Shop, production</text>
  <rect x="532" y="204" width="308" height="38" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="686" y="228" font-size="13">database: Shop, staging</text>
  <rect x="532" y="252" width="308" height="38" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="686" y="276" font-size="13">database: Blog, production</text>
  <path d="M464 106 C498 106 498 175 530 175" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#hierare-i)"/>
  <path d="M464 158 C498 158 498 223 530 223" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#hierare-i)"/>
  <path d="M464 272 C498 272 498 271 530 271" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#hierare-i)"/>
  <text x="686" y="352" font-size="12.5" font-weight="600">one ordinary server; no second server needed</text>
  <text x="24" y="426" font-size="12.5" text-anchor="start">Moving an environment changes only its routing record; its owner, identifiers and keys stay the same.</text>
  <rect x="24" y="445" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="54" y="456" font-size="12" fill="#5B5465" text-anchor="start">one per environment</text>
  <rect x="203.60000000000002" y="445" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="233.60000000000002" y="456" font-size="12" fill="#5B5465" text-anchor="start">shared</text>
  <rect x="300.0" y="445" width="22" height="14" rx="3" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="330.0" y="456" font-size="12" fill="#5B5465" text-anchor="start">environment database</text>
  </g>
</svg>
