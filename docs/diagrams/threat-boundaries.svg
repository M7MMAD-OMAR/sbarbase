  <path d="M576 152 C598 152 600 208 620 208" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threate-i)"/>
  <path d="M576 164 C594 164 596 276 620 276" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threate-i)"/>
  <path d="M830 146 L854 146 L854 372 L832 372" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threate-i)"/>
  <path d="M830 208 L854 208" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M726 300 L726 348" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threate-i)"/>
  <path d="M210 477 L408 477" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threate-i)"/>
  <path d="M117 508 L117 530 L726 530 L726 408" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threate-i)"/>
  <text x="310" y="470" font-size="11.5" fill="#5B5465">shell, Docker, SQL</text>
  <rect x="206" y="107" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="221" y="120" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B1</text>
  <rect x="297" y="109" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="312" y="122" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B4</text>
  <rect x="373" y="239" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="388" y="252" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B3</text>
  <rect x="851" y="283" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="866" y="296" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B2</text>
  <rect x="295" y="485" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="310" y="498" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B5</text>
  <rect x="827" y="97" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="842" y="110" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B6</text>
  <rect x="24" y="571" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="39" y="584" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B1</text>
  <text x="62" y="584" font-size="12" text-anchor="start">internet to gateway: a publishable key and a token</text>
  <rect x="462" y="571" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="477" y="584" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B2</text>
  <text x="500" y="584" font-size="12" text-anchor="start">environment to environment: its own connection rule pair</text>
  <rect x="24" y="593" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="39" y="606" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B3</text>
  <text x="62" y="606" font-size="12" text-anchor="start">app identity to management: an operator token</text>
  <rect x="462" y="593" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="477" y="606" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B4</text>
  <text x="500" y="606" font-size="12" text-anchor="start">network to console: only the proxy faces it</text>
  <rect x="24" y="615" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="39" y="628" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B5</text>
  <text x="62" y="628" font-size="12" text-anchor="start">host and secrets: private files, the operator inside</text>
  <rect x="462" y="615" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="477" y="628" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B6</text>
  <text x="500" y="628" font-size="12" text-anchor="start">supply chain: only pinned images run</text>
  </g>
</svg>
