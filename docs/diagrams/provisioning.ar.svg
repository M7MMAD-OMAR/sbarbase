<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="provisa-t provisa-d" xml:lang="ar" direction="rtl">
  <title id="provisa-t">التجهيز: سجّل أولًا، ثم نفّذ، ثم أغلق</title>
  <desc id="provisa-d">خمس خطوات. تضع واجهة الإدارة مهمة في الفهرس. يستلمها عامل واحد يملك قفلًا حصريًا. قبل أي أثر، يكتب العامل إيصال أثر يسمّي المطالبة والمحاولة ورمز العملية ويثبّته على القرص. ثم ينفَّذ الأثر المسيّج: SQL وقواعد الاتصال والخدمات، تحت حارس بمهلة. تُسجَّل النتيجة في الفهرس مع المهمة، ثم يُستهلك الإيصال. بعد الانهيار يُغلق الإيصال المكتمل، ويعاد إلى الطابور ما ثبت أنه توقف قبل أي تغيير لعدد محدود من المرات، وتمنع النتيجة المجهولة البدء والإعادة حتى يطابقها المشغّل.</desc>
  <defs><marker id="provisa-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="provisa-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="440" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="876" y="34" font-size="16" font-weight="700" text-anchor="start">التجهيز: سجّل أولًا، ثم نفّذ، ثم أغلق</text>
  <rect x="716" y="62" width="160" height="110" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <circle cx="856" cy="82" r="11" fill="#2A2632"/>
  <text x="856" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">1</text>
  <text x="838" y="87" font-size="13" font-weight="700" text-anchor="start">مهمة جديدة</text>
  <text x="796" y="116" font-size="12">تكتبها واجهة الإدارة</text>
  <text x="796" y="134" font-size="12">في الفهرس</text>
  <path d="M716 117 L704 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="542" y="62" width="160" height="110" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <circle cx="682" cy="82" r="11" fill="#2A2632"/>
  <text x="682" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">2</text>
  <text x="664" y="87" font-size="13" font-weight="700" text-anchor="start">الاستلام</text>
  <text x="622" y="116" font-size="12">عامل واحد</text>
  <text x="622" y="134" font-size="12">بقفل حصري</text>
  <path d="M542 117 L530 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="368" y="62" width="160" height="110" rx="8" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <circle cx="508" cy="82" r="11" fill="#2A2632"/>
  <text x="508" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">3</text>
  <text x="490" y="87" font-size="13" font-weight="700" text-anchor="start">إيصال الأثر</text>
  <text x="448" y="116" font-size="12">المطالبة والمحاولة</text>
  <text x="448" y="134" font-size="12">والرمز، على القرص</text>
  <path d="M368 117 L356 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="194" y="62" width="160" height="110" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <circle cx="334" cy="82" r="11" fill="#2A2632"/>
  <text x="334" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">4</text>
  <text x="316" y="87" font-size="13" font-weight="700" text-anchor="start">أثر مسيّج</text>
  <text x="274" y="116" font-size="12">SQL وقواعد الاتصال</text>
  <text x="274" y="134" font-size="12">والخدمات، بحارس</text>
  <text x="274" y="152" font-size="12">ومهلة</text>
  <path d="M194 117 L182 117" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="20" y="62" width="160" height="110" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <circle cx="160" cy="82" r="11" fill="#2A2632"/>
  <text x="160" y="86.5" font-size="12.5" font-weight="700" fill="#FFFBF1">5</text>
  <text x="142" y="87" font-size="13" font-weight="700" text-anchor="start">تسجيل النتيجة</text>
  <text x="100" y="116" font-size="12">في الفهرس مع المهمة</text>
  <text x="100" y="134" font-size="12">ثم يُستهلك</text>
  <text x="100" y="152" font-size="12">الإيصال</text>
  <text x="876" y="214" font-size="13" font-weight="700" text-anchor="start">بعد انهيار، عند إعادة التشغيل</text>
  <path d="M448 172 L448 226" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <path d="M740 226 L160 226" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M740 226 L740 244" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="604" y="246" width="272" height="84" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="740" y="272" font-size="13" font-weight="700">إيصال مكتمل</text>
  <text x="740" y="296" font-size="12.5">يُطابق مع الفهرس ويُغلق</text>
  <path d="M450 226 L450 244" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="314" y="246" width="272" height="84" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="450" y="272" font-size="13" font-weight="700">توقف قبل أي تغيير</text>
  <text x="450" y="296" font-size="12.5">ثبت ذلك، فيعاد إلى الطابور</text>
  <text x="450" y="314" font-size="12.5">لعدد محدود من المرات</text>
  <path d="M160 226 L160 244" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="24" y="246" width="272" height="84" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="160" y="272" font-size="13" font-weight="700">نتيجة مجهولة</text>
  <text x="160" y="296" font-size="12.5">تمنع البدء والإعادة،</text>
  <text x="160" y="314" font-size="12.5">ويطابقها المشغّل</text>
  <text x="876" y="368" font-size="12.5" text-anchor="start">لا تحذف إيصالًا معلقًا أو سجل عملية أو تثبيت جيل أو شاهد إلغاء لتتجاوز رفضًا.</text>
  <text x="876" y="390" font-size="12.5" fill="#5B5465" text-anchor="start">اختبارات الانهيار تغطي نقاطًا مسماة على بيئات ثابتة مؤقتة، لا كل انهيار ممكن.</text>
  <rect x="854" y="413" width="22" height="14" rx="3" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <text x="846" y="424" font-size="12" fill="#5B5465" text-anchor="start">سجل دائم</text>
  <rect x="744.8" y="413" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="736.8" y="424" font-size="12" fill="#5B5465" text-anchor="start">يمس المحرك المشترك</text>
  <rect x="571.6" y="413" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="563.6" y="424" font-size="12" fill="#5B5465" text-anchor="start">مُغلق</text>
  <rect x="481.6" y="413" width="22" height="14" rx="3" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="473.6" y="424" font-size="12" fill="#5B5465" text-anchor="start">يتوقف للمشغّل</text>
  </g>
</svg>
