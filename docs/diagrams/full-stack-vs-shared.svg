<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-labelledby="fullste-t fullste-d" xml:lang="en">
  <title id="fullste-t">A full stack per project, compared with Sbarbase</title>
  <desc id="fullste-d">Left: three projects, each running its own full stack of Studio, Auth, REST, Storage, Postgres, gateway and logs. Right: Sbarbase runs one gateway, a separate Auth and REST per environment, one PostgreSQL engine holding one database per environment with its own logins, and one shared tenant-aware Storage process. The shared parts are a shared failure boundary. A per-environment Studio is planned, not built.</desc>
  <defs><marker id="fullste-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="fullste-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="476" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="24" y="40" font-size="15" font-weight="700" text-anchor="start">A full stack per project</text>
  <rect x="24" y="64" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="79" y="83" font-size="12.5">Studio</text>
  <rect x="24" y="98" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="79" y="117" font-size="12.5">Auth</text>
  <rect x="24" y="132" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="79" y="151" font-size="12.5">REST</text>
  <rect x="24" y="166" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="79" y="185" font-size="12.5">Storage</text>
  <rect x="24" y="200" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="79" y="219" font-size="12.5">Postgres</text>
  <rect x="24" y="234" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="79" y="253" font-size="12.5">gateway, logs</text>
  <text x="79" y="290" font-size="12.5" font-weight="700">project 1</text>
  <rect x="146" y="64" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="201" y="83" font-size="12.5">Studio</text>
  <rect x="146" y="98" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="201" y="117" font-size="12.5">Auth</text>
  <rect x="146" y="132" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="201" y="151" font-size="12.5">REST</text>
  <rect x="146" y="166" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="201" y="185" font-size="12.5">Storage</text>
  <rect x="146" y="200" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="201" y="219" font-size="12.5">Postgres</text>
  <rect x="146" y="234" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="201" y="253" font-size="12.5">gateway, logs</text>
  <text x="201" y="290" font-size="12.5" font-weight="700">project 2</text>
  <rect x="268" y="64" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="323" y="83" font-size="12.5">Studio</text>
  <rect x="268" y="98" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="323" y="117" font-size="12.5">Auth</text>
  <rect x="268" y="132" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="323" y="151" font-size="12.5">REST</text>
  <rect x="268" y="166" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="323" y="185" font-size="12.5">Storage</text>
  <rect x="268" y="200" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="323" y="219" font-size="12.5">Postgres</text>
  <rect x="268" y="234" width="110" height="28" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="323" y="253" font-size="12.5">gateway, logs</text>
  <text x="323" y="290" font-size="12.5" font-weight="700">project 3</text>
  <text x="24" y="330" font-size="12.5" fill="#5B5465" text-anchor="start">Every part is repeated, upgraded</text>
  <text x="24" y="347" font-size="12.5" fill="#5B5465" text-anchor="start">and backed up per project.</text>
  <path d="M410 56 L410 380" fill="none" stroke="#C9BFAE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="40" font-size="15" font-weight="700" text-anchor="start">Sbarbase: shared engines</text>
  <rect x="440" y="60" width="436" height="34" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="658" y="82" font-size="13">one gateway and control API</text>
  <rect x="440" y="110" width="90" height="30" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="485" y="130" font-size="12">Auth, env A</text>
  <rect x="440" y="148" width="90" height="30" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="485" y="168" font-size="12">REST, env A</text>
  <path d="M485 178 L485 226" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullste-i)"/>
  <rect x="538" y="110" width="90" height="30" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="583" y="130" font-size="12">Auth, env B</text>
  <rect x="538" y="148" width="90" height="30" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="583" y="168" font-size="12">REST, env B</text>
  <path d="M583 178 L583 226" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullste-i)"/>
  <rect x="636" y="110" width="90" height="30" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="681" y="130" font-size="12">Auth, env C</text>
  <rect x="636" y="148" width="90" height="30" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="681" y="168" font-size="12">REST, env C</text>
  <path d="M681 178 L681 226" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullste-i)"/>
  <rect x="440" y="196" width="286" height="132" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="583" y="216" font-size="12.5" font-weight="700">one PostgreSQL engine</text>
  <rect x="448" y="228" width="86" height="84" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="491" y="262" font-size="12">database A</text>
  <text x="491" y="282" font-size="12">own logins</text>
  <rect x="540" y="228" width="86" height="84" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="583" y="262" font-size="12">database B</text>
  <text x="583" y="282" font-size="12">own logins</text>
  <rect x="632" y="228" width="86" height="84" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="675" y="262" font-size="12">database C</text>
  <text x="675" y="282" font-size="12">own logins</text>
  <rect x="740" y="110" width="136" height="218" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="808" y="190" font-size="12.5">Storage</text>
  <text x="808" y="210" font-size="12.5">one process,</text>
  <text x="808" y="230" font-size="12.5">a tenant per</text>
  <text x="808" y="250" font-size="12.5">environment</text>
  <path d="M658 94 L658 102 L808 102 L808 108" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#fullste-i)"/>
  <text x="820" y="98" font-size="11.5" fill="#5B5465" text-anchor="start">files</text>
  <rect x="440" y="344" width="436" height="36" rx="8" fill="#EFE9FA" stroke="#B7A2E6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="658" y="367" font-size="12.5">Studio per environment: planned, not built</text>
  <text x="24" y="408" font-size="12" text-anchor="start">PostgreSQL and Storage run once, so the same server has room for more projects.</text>
  <text x="24" y="426" font-size="12" text-anchor="start">Each extra environment adds its own small Auth and REST (under 20 MiB idle in one local sample).</text>
  <rect x="24" y="447" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="54" y="458" font-size="12" fill="#5B5465" text-anchor="start">shared: a shared failure boundary</text>
  <rect x="293.20000000000005" y="447" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="323.20000000000005" y="458" font-size="12" fill="#5B5465" text-anchor="start">one per environment</text>
  <rect x="472.80000000000007" y="447" width="22" height="14" rx="3" fill="#EFE9FA" stroke="#B7A2E6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="502.80000000000007" y="458" font-size="12" fill="#5B5465" text-anchor="start">planned</text>
  </g>
</svg>
