<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="fs-title fs-desc">
  <title id="fs-title">A full Supabase stack per project, compared with Sbarbase's shared engines</title>
  <desc id="fs-desc">Left: three projects, each running its own full stack of Studio, Auth, REST, Storage, Postgres, gateway and logs. Right: Sbarbase runs one gateway, a separate Auth and REST per environment, one PostgreSQL engine holding one database per environment with its own logins, and one shared tenant-aware Storage process. The shared parts, drawn in coral, are a shared failure boundary. A per-environment Studio is planned, not built.</desc>
  <defs>
    <filter id="fs-wob" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="wobbled"/>
      <feDropShadow in="wobbled" dx="0" dy="2" stdDeviation="1.3" flood-color="#2B1E10" flood-opacity="0.22"/>
    </filter>
    <marker id="fs-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="fs-ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="460" fill="#FFFBF1"/>

  <g font-family="'Marker Felt','Comic Neue','Segoe Print','Patrick Hand',cursive,sans-serif" font-size="13" fill="#2A2632" text-anchor="middle">

    <!-- LEFT: today, one full stack per project -->
    <text x="212" y="30" font-size="15" font-weight="700">Today: a full stack per project</text>
    <g filter="url(#fs-wob)" stroke="#2A2632">
      <g transform="translate(24 48) rotate(-0.8 58 122)">
        <rect x="0" y="0" width="116" height="244" rx="7" fill="#FFFDF7" stroke-width="1.6"/>
        <rect x="10" y="12" width="96" height="28" rx="4" fill="#B7A2E6" stroke-width="1.2"/>
        <rect x="10" y="48" width="96" height="28" rx="4" fill="#BFE3D8" stroke-width="1.2"/>
        <rect x="10" y="84" width="96" height="28" rx="4" fill="#BFE3D8" stroke-width="1.2"/>
        <rect x="10" y="120" width="96" height="28" rx="4" fill="#F7D3D4" stroke-width="1.2"/>
        <rect x="10" y="156" width="96" height="34" rx="4" fill="#F0C23E" stroke-width="1.2"/>
        <rect x="10" y="198" width="96" height="34" rx="4" fill="#E9E1D0" stroke-width="1.2"/>
      </g>
      <g transform="translate(154 48) rotate(0.6 58 122)">
        <rect x="0" y="0" width="116" height="244" rx="7" fill="#FFFDF7" stroke-width="1.6"/>
        <rect x="10" y="12" width="96" height="28" rx="4" fill="#B7A2E6" stroke-width="1.2"/>
        <rect x="10" y="48" width="96" height="28" rx="4" fill="#BFE3D8" stroke-width="1.2"/>
        <rect x="10" y="84" width="96" height="28" rx="4" fill="#BFE3D8" stroke-width="1.2"/>
        <rect x="10" y="120" width="96" height="28" rx="4" fill="#F7D3D4" stroke-width="1.2"/>
        <rect x="10" y="156" width="96" height="34" rx="4" fill="#F0C23E" stroke-width="1.2"/>
        <rect x="10" y="198" width="96" height="34" rx="4" fill="#E9E1D0" stroke-width="1.2"/>
      </g>
      <g transform="translate(284 48) rotate(-0.5 58 122)">
        <rect x="0" y="0" width="116" height="244" rx="7" fill="#FFFDF7" stroke-width="1.6"/>
        <rect x="10" y="12" width="96" height="28" rx="4" fill="#B7A2E6" stroke-width="1.2"/>
        <rect x="10" y="48" width="96" height="28" rx="4" fill="#BFE3D8" stroke-width="1.2"/>
        <rect x="10" y="84" width="96" height="28" rx="4" fill="#BFE3D8" stroke-width="1.2"/>
        <rect x="10" y="120" width="96" height="28" rx="4" fill="#F7D3D4" stroke-width="1.2"/>
        <rect x="10" y="156" width="96" height="34" rx="4" fill="#F0C23E" stroke-width="1.2"/>
        <rect x="10" y="198" width="96" height="34" rx="4" fill="#E9E1D0" stroke-width="1.2"/>
      </g>
    </g>
    <g>
      <text x="82" y="79">Studio</text><text x="212" y="79">Studio</text><text x="342" y="79">Studio</text>
      <text x="82" y="115">Auth</text><text x="212" y="115">Auth</text><text x="342" y="115">Auth</text>
      <text x="82" y="151">REST</text><text x="212" y="151">REST</text><text x="342" y="151">REST</text>
      <text x="82" y="187">Storage</text><text x="212" y="187">Storage</text><text x="342" y="187">Storage</text>
      <text x="82" y="226">Postgres</text><text x="212" y="226">Postgres</text><text x="342" y="226">Postgres</text>
      <text x="82" y="268" font-size="12">gateway, logs</text><text x="212" y="268" font-size="12">gateway, logs</text><text x="342" y="268" font-size="12">gateway, logs</text>
    </g>
    <text x="82" y="314">project 1</text><text x="212" y="314">project 2</text><text x="342" y="314">project 3</text>
    <text x="212" y="344" fill="#5B5465">every part repeated, upgraded</text>
    <text x="212" y="362" fill="#5B5465">and backed up per project</text>

    <!-- divider -->
    <line x1="416" y1="44" x2="416" y2="440" stroke="#2A2632" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 6"/>

    <!-- RIGHT: Sbarbase -->
    <text x="655" y="30" font-size="15" font-weight="700">Sbarbase: shared engines</text>
    <g filter="url(#fs-wob)">
      <rect x="455" y="44" width="400" height="36" rx="7" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
      <rect x="460" y="118" width="120" height="30" rx="5" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="460" y="156" width="120" height="30" rx="5" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="595" y="118" width="120" height="30" rx="5" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="595" y="156" width="120" height="30" rx="5" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="730" y="118" width="120" height="30" rx="5" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="730" y="156" width="120" height="30" rx="5" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.3"/>
      <rect x="455" y="212" width="400" height="100" rx="9" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
      <rect x="470" y="224" width="100" height="50" rx="5" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3" transform="rotate(-1 520 249)"/>
      <rect x="605" y="224" width="100" height="50" rx="5" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3" transform="rotate(0.8 655 249)"/>
      <rect x="740" y="224" width="100" height="50" rx="5" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3" transform="rotate(-0.6 790 249)"/>
      <rect x="455" y="330" width="400" height="46" rx="7" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
    </g>
    <text x="655" y="67">one gateway and control API</text>
    <text x="520" y="138">Auth, env A</text><text x="655" y="138">Auth, env B</text><text x="790" y="138">Auth, env C</text>
    <text x="520" y="176">REST, env A</text><text x="655" y="176">REST, env B</text><text x="790" y="176">REST, env C</text>
    <text x="520" y="246">database A</text><text x="655" y="246">database B</text><text x="790" y="246">database C</text>
    <text x="520" y="264" font-size="12">own logins</text><text x="655" y="264" font-size="12">own logins</text><text x="790" y="264" font-size="12">own logins</text>
    <text x="655" y="298">one PostgreSQL engine</text>
    <text x="655" y="350">one Storage process</text>
    <text x="655" y="367" font-size="12">a tenant per environment</text>

    <!-- arrows: gateway to each environment, services to their own database -->
    <g stroke="#2A2632" stroke-width="1.5" fill="none" marker-end="url(#fs-ah)">
      <path d="M520 82 C518 94 522 104 520 114"/>
      <path d="M655 82 C653 94 657 104 655 114"/>
      <path d="M790 82 C788 94 792 104 790 114"/>
      <path d="M520 188 C518 200 522 210 520 220"/>
      <path d="M655 188 C653 200 657 210 655 220"/>
      <path d="M790 188 C788 200 792 210 790 220"/>
    </g>
    <text x="587" y="104" font-size="12">per environment</text>
    <path d="M455 62 C426 72 428 330 451 350" stroke="#E06A4B" stroke-width="1.5" fill="none" marker-end="url(#fs-ahc)"/>
    <text x="0" y="0" font-size="12" fill="#B2472C" transform="translate(450 222) rotate(-90)">files</text>

    <!-- key, caption, planned -->
    <text x="655" y="404" font-size="14" font-weight="700" fill="#B2472C">coral = shared = shared failure boundary</text>
    <g filter="url(#fs-wob)">
      <rect x="555" y="420" width="200" height="28" rx="5" fill="#EFE8F9" stroke="#7E68B8" stroke-width="1.3" stroke-dasharray="5 4"/>
    </g>
    <text x="655" y="439" font-size="12">Studio per environment: planned</text>

    <g filter="url(#fs-wob)">
      <rect x="40" y="392" width="22" height="16" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="1.6"/>
      <rect x="40" y="420" width="22" height="16" rx="3" fill="#BFE3D8" stroke="#2A2632" stroke-width="1.2"/>
    </g>
    <text x="72" y="405" font-size="12" text-anchor="start">shared by every environment</text>
    <text x="72" y="433" font-size="12" text-anchor="start">one per environment</text>
  </g>
</svg>
