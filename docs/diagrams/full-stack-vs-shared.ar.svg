<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" role="img" aria-labelledby="fullsta-t fullsta-d" xml:lang="ar" direction="rtl">
  <title id="fullsta-t">حزمة كاملة لكل مشروع، مقارنة بصباربيز</title>
  <desc id="fullsta-d">على اليسار ثلاثة مشاريع، يشغّل كل منها حزمة كاملة خاصة به: Studio وAuth وREST وStorage وPostgres وبوابة وسجلات. وعلى اليمين صباربيز: بوابة واحدة، وAuth وREST منفصلان لكل بيئة، ومحرك PostgreSQL واحد فيه قاعدة بيانات لكل بيئة بحسابات دخولها الخاصة، وعملية Storage واحدة مشتركة تعرف المستأجرين. الأجزاء المشتركة حدود فشل مشتركة. Studio لكل بيئة مخطط وغير مبني.</desc>
