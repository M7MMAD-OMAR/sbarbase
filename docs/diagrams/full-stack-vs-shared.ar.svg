  <text x="80" y="98" font-size="11.5" fill="#5B5465" text-anchor="start">الملفات</text>
  <rect x="24" y="344" width="436" height="36" rx="8" fill="#EFE9FA" stroke="#B7A2E6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="242" y="367" font-size="12.5">Studio لكل بيئة: مخطط وغير مبني</text>
  <text x="876" y="408" font-size="12" text-anchor="start">يعمل PostgreSQL وStorage مرة واحدة، فيتسع الخادم نفسه لمشاريع أكثر.</text>
  <text x="876" y="426" font-size="12" text-anchor="start">وكل بيئة إضافية تضيف قاعدتها في المحرك وAuth وREST صغيرين، أقل من 20 MiB في الخمول في عينة محلية واحدة.</text>
  <text x="876" y="444" font-size="12" text-anchor="start">ومع ذلك يحجز فحص الخادم 512 MiB من الحدود لكل بيئة، ويسمح حارس المختبر بأربع بيئات حاليًا.</text>
