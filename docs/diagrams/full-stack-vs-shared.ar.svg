  <text x="92" y="190" font-size="12.5" direction="ltr">Storage</text>
  <text x="92" y="210" font-size="12.5">عملية واحدة،</text>
  <text x="92" y="230" font-size="12.5">مستأجر لكل</text>
  <text x="92" y="250" font-size="12.5">بيئة</text>
