  <text x="876" y="330" font-size="12.5" fill="#5B5465" text-anchor="start">كل جزء يتكرر، ويُرقّى</text>
  <text x="876" y="347" font-size="12.5" fill="#5B5465" text-anchor="start">ويُنسخ احتياطيًا لكل مشروع.</text>
