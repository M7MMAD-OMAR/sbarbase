  <text x="838" y="606" font-size="12" text-anchor="start">من هوية التطبيق إلى الإدارة: رمز مشغّل</text>
  <rect x="408" y="593" width="30" height="18" rx="9" fill="#E06A4B"/>
  <text x="423" y="606" font-size="11.5" font-weight="700" fill="#FFFBF1" direction="ltr">B4</text>
  <text x="400" y="606" font-size="12" text-anchor="start">من الشبكة إلى اللوحة: الوكيل وحده يواجهها</text>
  <rect x="846" y="615" width="30" height="18" rx="9" fill="#E06A4B"/>
