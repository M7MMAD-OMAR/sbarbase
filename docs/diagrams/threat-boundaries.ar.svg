<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" role="img" aria-labelledby="threata-t threata-d" xml:lang="ar" direction="rtl">
  <title id="threata-t">حدود الثقة من B1 إلى B6</title>
  <desc id="threata-d">زوار التطبيقات والمهاجمون على الشبكة في الإنترنت غير الموثوق، ولا يصلون إلا إلى وكيل TLS على المنفذ العام. B1: يحتاج الزائر مفتاحًا عامًا ورمزًا ليعبر البوابة. B3: تقبل واجهة الإدارة ولوحتها رمز مشغّل يتحقق منه نطاق Auth الإدارة المنفصل. B4: الوكيل وحده يواجه الشبكة، والبوابة والإدارة على العنوان المحلي. البيئتان أ وب، لكل منهما Auth وREST وقاعدة وثلاثة حسابات دخول، وعملية Storage المشتركة على شبكة Docker داخلية. B2: لا تصل كل بيئة إلى محرك PostgreSQL المشترك إلا عبر زوج قواعد الاتصال الخاص بها. B5: المشغّل الموثوق يستخدم سطر الأوامر وDocker وSQL، ويحفظ الحالة الخاصة في ‎.secrets و‎.lab. B6: لا تعمل إلا صور المصدر المثبّتة.</desc>
  <defs><marker id="threata-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="threata-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
