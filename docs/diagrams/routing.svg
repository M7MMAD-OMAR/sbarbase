<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="routine-t routine-d" xml:lang="en">
  <title id="routine-t">The full routing, by path</title>
  <desc id="routine-d">An app using supabase-js and an operator browser both reach the TLS proxy, the operator's own or deploy/console-tls-proxy.ts, which forwards to the loopback server. It routes by path: /management/auth/v1/* to the management Auth realm with its own database, /management/* to the control API with the catalog, keys and provisioning status, and an environment's auth, rest or storage path to the gateway, which checks the key, maintenance, admission and body cap. The gateway forwards to that environment's Auth or PostgREST, or to the shared Storage with a tenant header; all three reach the environment database on the shared PostgreSQL engine. The control API keeps the SQLite control catalog, and the provisioning worker reads it and runs the pinned database containers.</desc>
  <defs><marker id="routine-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="routine-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="640" fill="#F5EFE3"/>
