  <text x="736" y="563" font-size="11.5">on the shared PostgreSQL engine</text>
  <rect x="310" y="428" width="240" height="54" rx="8" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <text x="430" y="450" font-size="13" font-weight="700">control catalog</text>
  <text x="430" y="469" font-size="11.5">SQLite</text>
  <path d="M450 394 L450 426" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routine-i)"/>
  <rect x="24" y="428" width="240" height="54" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="144" y="450" font-size="13" font-weight="700">provisioning worker</text>
