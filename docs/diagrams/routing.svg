  <path d="M736 482 L736 518" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routine-i)"/>
  <rect x="788" y="428" width="88" height="54" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="832" y="450" font-size="12.5" font-weight="700">Storage</text>
  <text x="832" y="469" font-size="11">tenant header</text>
  <path d="M832 394 L832 426" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routine-i)"/>
  <path d="M832 482 L832 518" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routine-i)"/>
