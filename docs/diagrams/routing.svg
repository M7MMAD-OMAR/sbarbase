  <text x="245" y="85" font-size="13" font-weight="700">your app</text>
  <text x="245" y="103" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">supabase-js</text>
  <rect x="560" y="62" width="190" height="52" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="655" y="85" font-size="13" font-weight="700">operator browser</text>
  <text x="655" y="103" font-size="11.5">the console</text>
  <rect x="290" y="146" width="320" height="56" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="168" font-size="13" font-weight="700">TLS proxy</text>
  <text x="450" y="188" font-size="11.5">the operator's own, or deploy/console-tls-proxy.ts</text>
  <rect x="350" y="230" width="200" height="52" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="252" font-size="13" font-weight="700">loopback server</text>
  <text x="450" y="270" font-size="11.5">routes by path</text>
  <rect x="24" y="318" width="280" height="76" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="164" y="340" font-size="13" font-weight="700">management Auth</text>
  <text x="164" y="360" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">/management/auth/v1/*</text>
  <text x="164" y="380" font-size="11.5">own database</text>
  <rect x="310" y="318" width="280" height="76" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="340" font-size="13" font-weight="700">control API</text>
  <text x="450" y="360" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">/management/*</text>
  <text x="450" y="380" font-size="11.5">catalog, keys, provisioning</text>
  <rect x="596" y="318" width="280" height="76" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="736" y="340" font-size="13" font-weight="700">gateway</text>
  <text x="736" y="360" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">/ENV/{auth,rest,storage}/v1/*</text>
  <text x="736" y="380" font-size="11.5">key, maintenance, admission, body cap</text>
