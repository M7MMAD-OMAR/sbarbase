<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="routina-t routina-d" xml:lang="ar" direction="rtl">
  <title id="routina-t">التوجيه الكامل، بحسب المسار</title>
  <desc id="routina-d">يصل تطبيق يستخدم supabase-js ومتصفح المشغّل كلاهما إلى وكيل TLS، وكيل المشغّل نفسه أو deploy/console-tls-proxy.ts، فيمرر الطلب إلى الخادم المحلي. يوجّه الخادم بحسب المسار: /management/auth/v1/* إلى نطاق Auth الإدارة بقاعدته الخاصة، و/management/* إلى واجهة الإدارة بالفهرس والمفاتيح وحالة التجهيز، ومسار auth أو rest أو storage لبيئة ما إلى البوابة، فتفحص المفتاح والصيانة والقبول وحد حجم الطلب. ثم تمرره البوابة إلى Auth أو PostgREST الخاصين بتلك البيئة، أو إلى Storage المشترك بترويسة المستأجر، وتصل الثلاثة إلى قاعدة البيئة على محرك PostgreSQL المشترك. تحفظ واجهة الإدارة فهرس التحكم في SQLite، ويقرؤه عامل التجهيز ويشغّل حاويات القواعد المثبّتة.</desc>
  <defs><marker id="routina-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="routina-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="0" y="0" width="900" height="640" fill="#F5EFE3"/>
  <g font-family="system-ui, sans-serif" fill="#2A2632" text-anchor="middle">
  <text x="876" y="34" font-size="16" font-weight="700" text-anchor="start">التوجيه الكامل، بحسب المسار</text>
  <rect x="560" y="62" width="190" height="52" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="655" y="85" font-size="13" font-weight="700">تطبيقك</text>
  <text x="655" y="103" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" direction="ltr">supabase-js</text>
  <rect x="150" y="62" width="190" height="52" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="245" y="85" font-size="13" font-weight="700">متصفح المشغّل</text>
  <text x="245" y="103" font-size="11.5">لوحة الإدارة</text>
  <rect x="290" y="146" width="320" height="56" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="168" font-size="13" font-weight="700">وكيل TLS</text>
  <text x="450" y="188" font-size="11.5">وكيل المشغّل، أو deploy/console-tls-proxy.ts</text>
  <rect x="350" y="230" width="200" height="52" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="252" font-size="13" font-weight="700">الخادم المحلي</text>
  <text x="450" y="270" font-size="11.5">يوجّه بحسب المسار</text>
  <rect x="596" y="318" width="280" height="76" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="736" y="340" font-size="13" font-weight="700">Auth الإدارة</text>
  <text x="736" y="360" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" direction="ltr">‎/management/auth/v1/*‎</text>
  <text x="736" y="380" font-size="11.5">بقاعدته الخاصة</text>
  <rect x="310" y="318" width="280" height="76" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="340" font-size="13" font-weight="700">واجهة الإدارة</text>
  <text x="450" y="360" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" direction="ltr">‎/management/*‎</text>
  <text x="450" y="380" font-size="11.5">الفهرس والمفاتيح والتجهيز</text>
  <rect x="24" y="318" width="280" height="76" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
