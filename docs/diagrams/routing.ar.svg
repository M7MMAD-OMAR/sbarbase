  <text x="164" y="563" font-size="11.5">على محرك PostgreSQL المشترك</text>
  <rect x="350" y="428" width="240" height="54" rx="8" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <text x="470" y="450" font-size="13" font-weight="700">فهرس التحكم</text>
