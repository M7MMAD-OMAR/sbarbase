<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="loadise-t loadise-d" xml:lang="en">
  <title id="loadise-t">A busy environment borrows idle room, never its neighbour's share</title>
  <desc id="loadise-d">Environment A receives a burst of requests while environment B has normal traffic. The gateway has 32 slots. Each environment is guaranteed 8. A busy environment may borrow idle slots up to 24, but only while 8 slots stay free for environments within their share. Here A holds its 8 and has borrowed 14; B uses 2; the last 8 are kept free. A's next request gets 429 and retries shortly; B's next request is admitted at once. When B needs more room, A borrows nothing new and its borrowed slots return as its requests finish. After 15 minutes like this the operator gets one notice. Behind the gateway, each environment's Auth and REST run in their own containers with CPU, memory and IO limits, and each database has its own connection limits. CPU, memory and IO inside the one PostgreSQL engine remain shared, and the limits are not calibrated under sustained load.</desc>
  <defs><marker id="loadise-i" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2A2632" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="loadise-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E06A4B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
