  <text x="625" y="94" font-size="12.5" font-weight="700">Auth, REST: env A</text>
  <text x="625" y="118" font-size="12">own containers:</text>
  <text x="625" y="135" font-size="12">CPU, memory and</text>
  <text x="625" y="152" font-size="12">IO limits</text>
  <rect x="540" y="236" width="170" height="100" rx="8" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="625" y="260" font-size="12.5" font-weight="700">Auth, REST: env B</text>
  <text x="625" y="284" font-size="12">own containers:</text>
