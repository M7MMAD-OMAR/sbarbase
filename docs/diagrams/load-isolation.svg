  <rect x="479" y="100" width="7" height="26" rx="1.5" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="231" y="144" font-size="12" fill="#A8412A" text-anchor="start">A: its share of 8, plus 14 borrowed</text>
  <text x="231" y="163" font-size="12" fill="#146B5C" text-anchor="start">B: 2 in use, within its share of 8</text>
  <text x="231" y="182" font-size="12" text-anchor="start">last 8: kept free for any share</text>
  <text x="231" y="214" font-size="12" font-weight="700" fill="#A8412A" text-anchor="start">A asks for more: 429, retry shortly</text>
  <text x="231" y="236" font-size="12" font-weight="700" fill="#146B5C" text-anchor="start">B asks: admitted at once</text>
  <text x="231" y="264" font-size="11.5" fill="#5B5465" text-anchor="start">A never passes 24. When B needs room,</text>
  <text x="231" y="281" font-size="11.5" fill="#5B5465" text-anchor="start">A borrows nothing new, and its borrowed</text>
  <text x="231" y="298" font-size="11.5" fill="#5B5465" text-anchor="start">slots return as its requests finish.</text>
  <text x="231" y="334" font-size="11.5" font-weight="700" text-anchor="start">15 minutes like this: one operator notice</text>
  <path d="M226 210 L116 210" fill="none" stroke="#E06A4B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loadise-c)"/>
