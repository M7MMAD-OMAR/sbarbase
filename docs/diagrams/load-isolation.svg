  <text x="808" y="84" font-size="12.5" font-weight="700">PostgreSQL</text>
  <text x="808" y="102" font-size="12">one engine</text>
  <rect x="752" y="116" width="112" height="74" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="808" y="138" font-size="11.5">database A</text>
  <text x="808" y="155" font-size="11.5">18 connections</text>
  <text x="808" y="172" font-size="11.5">6 per login</text>
  <rect x="752" y="262" width="112" height="74" rx="8" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="808" y="284" font-size="11.5">database B</text>
  <text x="808" y="301" font-size="11.5">18 connections</text>
  <text x="808" y="318" font-size="11.5">6 per login</text>
  <text x="808" y="214" font-size="11.5" fill="#5B5465">REST statements</text>
  <text x="808" y="231" font-size="11.5" fill="#5B5465">stop after 8 s</text>
  <path d="M710 120 C726 120 730 153 750 153" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loadise-i)"/>
  <path d="M710 286 C726 286 730 299 750 299" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loadise-i)"/>
  <rect x="24" y="372" width="852" height="64" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="396" font-size="13.5" font-weight="700">Result: A uses the idle server, and B is still served at once.</text>
  <text x="450" y="420" font-size="12">Local probes measured the fixed share of 8 and a neighbour still served; borrowing is covered by unit tests.</text>
  <text x="24" y="462" font-size="12" fill="#5B5465" text-anchor="start">Not calibrated under sustained load: CPU, memory and IO inside the one PostgreSQL engine stay shared, so a heavy neighbour can still slow the others.</text>
  <rect x="24" y="483" width="22" height="14" rx="3" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="54" y="494" font-size="12" fill="#5B5465" text-anchor="start">A, its share</text>
  <rect x="158.8" y="483" width="22" height="14" rx="3" fill="#FDEDE6" stroke="#E06A4B" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="188.8" y="494" font-size="12" fill="#5B5465" text-anchor="start">A, borrowed</text>
  <rect x="287.20000000000005" y="483" width="22" height="14" rx="3" fill="#BFE3D8" stroke="#1F8A78" stroke-width="1.8"/>
  <text x="317.20000000000005" y="494" font-size="12" fill="#5B5465" text-anchor="start">B, or one per environment</text>
  <rect x="505.20000000000005" y="483" width="22" height="14" rx="3" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="535.2" y="494" font-size="12" fill="#5B5465" text-anchor="start">kept free</text>
  <rect x="620.8000000000001" y="483" width="22" height="14" rx="3" fill="#F0C23E" stroke="#2A2632" stroke-width="1.3"/>
  <text x="650.8000000000001" y="494" font-size="12" fill="#5B5465" text-anchor="start">environment database</text>
  </g>
