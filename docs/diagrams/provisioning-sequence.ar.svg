  <circle cx="770.8" cy="136" r="11" fill="#2A2632"/>
  <text x="770.8" y="140.5" font-size="12.5" font-weight="700" fill="#FFFBF1">1</text>
  <text x="708.0" y="140" font-size="12">مهمة جديدة</text>
  <text x="708.0" y="155" font-size="12">البيئة والمحاولة</text>
