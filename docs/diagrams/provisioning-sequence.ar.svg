  <path d="M454 442 L618 442" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <circle cx="424.0" cy="472" r="11" fill="#2A2632"/>
  <text x="424.0" y="476.5" font-size="12.5" font-weight="700" fill="#FFFBF1">7</text>
  <text x="364.0" y="476" font-size="12">استهلاك الإيصال</text>
  <path d="M446 488 L282 488" fill="none" stroke="#2A2632" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#provisa-i)"/>
  <rect x="200" y="524" width="328" height="58" rx="8" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="364" y="547" font-size="12.5" font-weight="700" fill="#A8412A">بعد انهيار، عند إعادة التشغيل</text>
  <text x="364" y="568" font-size="12">إيصال مكتمل: يُغلق. إيصال مجهول: يتوقف.</text>
  <text x="876" y="552" font-size="12.5" font-weight="700" text-anchor="start">النتائج المجهولة</text>
  <text x="876" y="570" font-size="12.5" fill="#5B5465" text-anchor="start">لا تُنفَّذ مرتين</text>
  <rect x="854" y="605" width="22" height="14" rx="3" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <text x="846" y="616" font-size="12" fill="#5B5465" text-anchor="start">سجل دائم</text>
  <rect x="744.8" y="605" width="22" height="14" rx="3" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="736.8" y="616" font-size="12" fill="#5B5465" text-anchor="start">يمس المحرك المشترك</text>
  <rect x="571.6" y="605" width="22" height="14" rx="3" fill="#F9D9CF" stroke="#E06A4B" stroke-width="1.8"/>
  <text x="563.6" y="616" font-size="12" fill="#5B5465" text-anchor="start">يتوقف للمشغّل</text>
