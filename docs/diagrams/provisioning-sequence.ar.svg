<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" role="img" aria-labelledby="provisa-t provisa-d" xml:lang="ar" direction="rtl">
  <title id="provisa-t">التجهيز، رسالة بعد رسالة</title>
  <desc id="provisa-d">خمسة أطراف: واجهة الإدارة، والفهرس، والعامل الذي يملك قفلًا حصريًا، وملف الإيصال، وDocker مع SQL. تضع واجهة الإدارة مهمة مع بيئتها ومحاولتها. يستلمها العامل، ويكتب إيصالًا يسمّي المطالبة والمحاولة والرمز ويثبّته على القرص، ثم ينفّذ SQL المسيّج وقواعد الاتصال والخدمات. يعيد Docker وSQL نتيجة معروفة، فيسجّلها العامل مع إتمام المهمة ويستهلك الإيصال. بعد الانهيار يُغلق الإيصال المكتمل، ويمنع الإيصال المجهول البدء والإعادة.</desc>
