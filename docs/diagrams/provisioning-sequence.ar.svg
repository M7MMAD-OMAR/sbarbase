  <text x="622" y="100" font-size="11.5" fill="#5B5465" direction="ltr">SQLite</text>
  <path d="M622 112 L622 508" fill="none" stroke="#5B5465" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
  <rect x="374" y="58" width="152" height="54" rx="8" fill="#FFFBF1" stroke="#2A2632" stroke-width="1.4"/>
  <text x="450" y="82" font-size="13" font-weight="700">العامل</text>
  <text x="450" y="100" font-size="11.5" fill="#5B5465">قفل حصري</text>
  <path d="M450 112 L450 508" fill="none" stroke="#5B5465" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
  <rect x="202" y="58" width="152" height="54" rx="8" fill="#FBE7A8" stroke="#2A2632" stroke-width="1.3"/>
  <text x="278" y="82" font-size="13" font-weight="700">ملف الإيصال</text>
  <text x="278" y="100" font-size="11.5" fill="#5B5465">على القرص</text>
  <path d="M278 112 L278 508" fill="none" stroke="#5B5465" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/>
  <rect x="30" y="58" width="152" height="54" rx="8" fill="#F6C7B6" stroke="#E06A4B" stroke-width="2"/>
  <text x="106" y="82" font-size="13" font-weight="700" direction="ltr">Docker, SQL</text>
