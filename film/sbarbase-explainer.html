<!doctype html>
<meta charset="utf-8">
<title>sbarbase explainer</title>
<style>
  @font-face{font-family:"Hand";src:url(hand.woff2) format("woff2");font-weight:300 700}
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(96vw,960px);height:auto;background:#000}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script>
<script>
'use strict';
// ============================================================
// SBARBASE, HOW IT WORKS. A short explainer drawn by hand on paper, 16:9, 24 fps, about 40 s.
// No words in the drawing except technical labels (Postgres, Auth, REST, gateway, Storage);
// the sentence for each beat lives in the page as captions (explainer.ar.vtt, explainer.en.vtt).
// Look: brush-pen ink with gouache fills and washes on warm paper. Scenery draws itself once and
// holds still; the cactus (sabbar) boils slightly so it feels alive. One metaphor carries the film:
//   server = one building, client = a floor, project = an apartment, environment = a lit window
//   with its own lock and its own database drum in the shared Postgres basement, the gateway is
//   the front booth, requests are paper planes, backups are parcels flying to a cloud at night.
// Font: Marhey (SIL OFL 1.1, OFL-Marhey.txt) for labels.
//
// t      dur  scene     viewer notices                                          action
// 0.0    7.5  stacks    three full Supabase stacks on one server, it sags        stacks draw on one by one, plank bends, cactus worries
// 7.5    9.5  building  one building: basement Postgres, floors, windows          draws on, windows light with locks, pipes to drums, hierarchy rings
// 17.0   8.0  requests  paper planes enter the gateway and reach their own window one without a key bounces off
// 25.0   8.0  night     parcels fly to a cloud at night; morning, one window fails and is restored
// 33.0   8.5  install   one command types itself, the building lights, the cactus waves, wordmark
// ============================================================

const INK = '#2A2632';
usePalette(makePalette({ paper: '#F5EFE3', paperBand: 'rgba(0,0,0,0)', ink: INK, light: '#FFFBF1', blush: '#EC9197',
  night: '#1D2158', accents: ['#E06A4B', '#1F8A78', '#F0C23E', '#B7A2E6'], guide: 'rgba(42,38,50,.25)' }));
const C = { coral: '#E06A4B', coralSoft: '#F6C7B6', teal: '#1F8A78', tealSoft: '#BFE3D8', mustard: '#F0C23E', mustardSoft: '#FBE7A6',
  lilac: '#B7A2E6', lilacSoft: '#E6DDF7', pink: '#F7D3D4', paper: '#FFFBF1', cactus: '#3E9E6E', pot: '#B7734A', potRim: '#C98458', lit: '#FFE9A0', dark: '#3B3F6E' };

// ---------- small geometry and marks ----------
const RP = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function dense(pts, close = true, step = 14) { const out = [], n = pts.length, segs = close ? n : n - 1;
  for (let k = 0; k < segs; k++) { const a = pts[k], b = pts[(k + 1) % n], m = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let j = 0; j < m; j++) out.push([lerp(a[0], b[0], j / m), lerp(a[1], b[1], j / m)]); }
  if (close) out.push(pts[0]); else out.push(pts[n - 1]); return out; }
function label(c, text, x, y, o = {}) { const { size = 34, color = INK, al = 1, align = 'center', weight = 600, font = 'Hand' } = o; if (al <= 0) return;
  c.save(); c.globalAlpha *= al; c.fillStyle = color; c.textAlign = align; c.textBaseline = 'middle'; c.font = `${weight} ${size}px ${font}, "Comic Sans MS", sans-serif`; c.fillText(text, x, y); c.restore(); }
// a box that draws itself: body colour, then its outline, then an optional label
function boxD(d, x, y, w, h, fill, o = {}) { const { lw = 3.4, text, size = 30, tc = INK, r = 10 } = o;
  d.fill(roundRectPath(x, y, w, h, r), fill).line(dense(RP(x, y, w, h)), { w: lw, smooth: false });
  if (text) d.mark((c, k) => label(c, text, x + w / 2, y + h / 2 + 1, { size, color: tc, al: k }), .06); return d; }
function lockMark(c, x, y, s, k, col = INK) { if (k <= 0) return; c.save(); c.globalAlpha *= k; c.translate(x, y); c.scale(s * (0.6 + .4 * easeOutBack(k)), s * (0.6 + .4 * easeOutBack(k)));
  c.fillStyle = C.mustard; c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.arc(0, -10, 10, Math.PI, 0); c.stroke();
  c.beginPath(); c.roundRect(-14, -10, 28, 22, 4); c.fill(); c.stroke(); c.fillStyle = col; c.beginPath(); c.arc(0, 0, 3, 0, TAU); c.fill(); c.restore(); }
function checkMark(c, x, y, s, k, col = C.teal) { if (k <= 0) return; c.save(); c.strokeStyle = col; c.lineWidth = 7 * s; c.lineCap = 'round'; c.lineJoin = 'round';
  const P = [[-20, 0], [-6, 14], [22, -16]].map(([a, b]) => [x + a * s, y + b * s]), L1 = Math.hypot(14, 14), L2 = Math.hypot(28, 30), L = (L1 + L2) * k;
  c.beginPath(); c.moveTo(...P[0]); if (L <= L1) c.lineTo(lerp(P[0][0], P[1][0], L / L1), lerp(P[0][1], P[1][1], L / L1)); else { c.lineTo(...P[1]); const u = (L - L1) / L2; c.lineTo(lerp(P[1][0], P[2][0], u), lerp(P[1][1], P[2][1], u)); } c.stroke(); c.restore(); }
function crossMark(c, x, y, s, k, col = C.coral) { if (k <= 0) return; c.save(); c.strokeStyle = col; c.lineWidth = 8 * s; c.lineCap = 'round'; const a = Math.min(1, k * 2), b = clamp(k * 2 - 1, 0, 1);
  c.beginPath(); c.moveTo(x - 18 * s, y - 18 * s); c.lineTo(x - 18 * s + 36 * s * a, y - 18 * s + 36 * s * a); c.stroke();
  if (b > 0) { c.beginPath(); c.moveTo(x + 18 * s, y - 18 * s); c.lineTo(x + 18 * s - 36 * s * b, y - 18 * s + 36 * s * b); c.stroke(); } c.restore(); }
function plane(c, x, y, ang, s, col = C.paper, al = 1) { if (al <= 0) return; c.save(); c.globalAlpha *= al; c.translate(x, y); c.rotate(ang); c.scale(s, s);
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(30, 0); c.lineTo(-24, -18); c.lineTo(-12, 0); c.lineTo(-24, 18); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(30, 0); c.lineTo(-12, 0); c.stroke(); c.restore(); }
function parcel(c, x, y, s, al = 1) { if (al <= 0) return; c.save(); c.globalAlpha *= al; c.translate(x, y); c.scale(s, s); c.fillStyle = C.coral; c.strokeStyle = INK; c.lineWidth = 3;
  c.beginPath(); c.roundRect(-22, -18, 44, 36, 5); c.fill(); c.stroke(); c.strokeStyle = C.mustard; c.lineWidth = 5; c.beginPath(); c.moveTo(0, -18); c.lineTo(0, 18); c.moveTo(-22, 0); c.lineTo(22, 0); c.stroke();
  c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.roundRect(-22, -18, 44, 36, 5); c.stroke(); c.restore(); }
const zoomAt = (c, z, x, y) => { c.translate(x, y); c.scale(z, z); c.translate(-x, -y); };
const bz = (a, b, cc, t) => [lerp(lerp(a[0], cc[0], t), lerp(cc[0], b[0], t), t), lerp(lerp(a[1], cc[1], t), lerp(cc[1], b[1], t), t)];
const bzAng = (a, b, cc, t) => { const p = bz(a, b, cc, Math.max(0, t - .01)), q = bz(a, b, cc, Math.min(1, t + .01)); return Math.atan2(q[1] - p[1], q[0] - p[0]); };

// ---------- the cactus: whole drawings per pose, drawn on with the pen ----------
// pose: 'rest' | 'point' | 'wave' | 'worry' | 'happy'; wave angle w in radians for the raised arm
function cactus(d, x, y, s, pose = 'rest', w = 0) {
  const P = (px, py) => [x + px * s, y + py * s], M = pts => pts.map(p => P(...p));
  const pot = M([[-70, -84], [70, -84], [55, 0], [-55, 0]]), rim = M([[-80, -104], [80, -104], [80, -80], [-80, -80]]);
  const body = M([[-44, -96], [-48, -190], [-40, -262], [-18, -300], [0, -306], [18, -300], [40, -262], [48, -190], [44, -96]]);
  d.fill(polyPath(pot), C.pot).line(dense(pot), { w: 3.4, smooth: false }).fill(polyPath(rim), C.potRim).line(dense(rim), { w: 3.4, smooth: false });
  d.fill(splinePath(body), C.cactus).line(body, { close: true, w: 3.6 });
  // near arm (towards the building, on the left): rest bends up, point reaches out, wave rises
  const near = pose === 'point' ? M([[-44, -170], [-96, -196], [-150, -228], [-164, -218], [-104, -176], [-46, -146]])
    : M([[-44, -160], [-86, -160], [-94, -206], [-78, -214], [-70, -180], [-46, -182]]);
  d.fill(splinePath(near), C.cactus).line(near, { close: true, w: 3.2 });
  const far = (pose === 'wave' ? [[44, -170], [92, -178 - 30 * Math.sin(w)], [110 + 20 * Math.sin(w), -236], [96 + 20 * Math.sin(w), -246], [80, -196], [44, -196]]
    : pose === 'happy' ? [[44, -170], [96, -190], [118, -246], [102, -254], [84, -206], [44, -196]]
    : [[44, -150], [84, -150], [92, -196], [76, -204], [68, -170], [44, -172]]).map(p => P(...p));
  d.fill(splinePath(far), C.cactus).line(far, { close: true, w: 3.2 });
  d.lines([[[-20, -140], [-26, -146]], [[22, -118], [28, -124]], [[0, -236], [0, -246]], [[-26, -250], [-32, -256]], [[24, -210], [30, -216]]].map(M), { w: 2.2, color: '#DDF2E6', dur: .03, stagger: .01 });
  // flower
  d.mark((c, k) => { c.save(); c.globalAlpha *= k; c.fillStyle = C.pink; c.strokeStyle = C.paper; c.lineWidth = 2; [[0, -318, 13], [-14, -308, 11], [14, -308, 11], [-8, -296, 10], [8, -296, 10]].forEach(([a, b, r]) => { const [px, py] = P(a, b); c.beginPath(); c.arc(px, py, r * s, 0, TAU); c.fill(); c.stroke(); });
    const [fx, fy] = P(0, -306); c.fillStyle = C.mustard; c.beginPath(); c.arc(fx, fy, 6 * s, 0, TAU); c.fill(); c.restore(); }, .1);
  // face
  d.mark((c, k) => { c.save(); c.globalAlpha *= k; c.fillStyle = INK; c.strokeStyle = INK; c.lineWidth = 3.2 * s; c.lineCap = 'round';
    const [lx, ly] = P(-16, -216), [rx, ry] = P(16, -216);
    if (pose === 'happy') { c.beginPath(); c.arc(lx, ly + 3 * s, 7 * s, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); c.beginPath(); c.arc(rx, ry + 3 * s, 7 * s, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
    else if (pose === 'worry') { c.fillStyle = C.paper; [lx, rx].forEach(ex => { c.beginPath(); c.arc(ex, ly, 8 * s, 0, TAU); c.fill(); c.stroke(); }); c.fillStyle = INK; [lx, rx].forEach(ex => { c.beginPath(); c.arc(ex + 1.5 * s, ly + 1 * s, 3.4 * s, 0, TAU); c.fill(); }); }
    else { [lx, rx].forEach(ex => { c.beginPath(); c.ellipse(ex, ly, 4.6 * s, 5.4 * s, 0, 0, TAU); c.fill(); }); }
    c.fillStyle = C.blushCol || '#F29BA0'; c.globalAlpha *= .85; const [ax, ay] = P(-28, -200), [bx, by] = P(28, -200); c.beginPath(); c.arc(ax, ay, 7 * s, 0, TAU); c.arc(bx, by, 7 * s, 0, TAU); c.fill(); c.globalAlpha /= .85;
    const [mx, my] = P(0, -198); c.beginPath();
    if (pose === 'worry') { c.arc(mx, my + 6 * s, 5 * s, 0, TAU); c.stroke(); } else { c.arc(mx, my - 2 * s, 8 * s, Math.PI * .2, Math.PI * .8); c.stroke(); }
    c.restore(); }, .15);
  return d; }

// ---------- the building: one server holding every environment ----------
// coordinates for a 1920 x 1080 frame; the building is centred a little left of the middle
function G() { const bx = 640, bw = 660, top = 170, gy = 800;
  const win = [{ x: 690, y: 616, w: 150, h: 120, floor: 'A' }, { x: 900, y: 616, w: 150, h: 120, floor: 'A' }, { x: 1080, y: 360, w: 150, h: 120, floor: 'B' }, { x: 870, y: 360, w: 150, h: 120, floor: 'B', spare: true }];
  const drums = [{ x: 700 }, { x: 850 }, { x: 1000 }, { x: 1150 }].map(d => ({ ...d, y: 852, w: 110, h: 84 }));
  return { bx, bw, top, gy, win, drums, booth: { x: 440, y: 690, w: 150, h: 110 }, shed: { x: 1330, y: 712, w: 150, h: 88 }, floorA: { y: 556, h: 244 }, floorB: { y: 300, h: 244 } }; }
const winC = w => [w.x + w.w / 2, w.y + w.h / 2];

function buildingD(d, o = {}) { const g = G(), { bx, bw, top, gy } = g, { lit = [1, 1, 1], locks = [1, 1, 1], ground = true } = o;
  // basement: the one shared Postgres engine, and a drum per environment
  boxD(d, bx, gy + 8, bw, 160, C.coralSoft, { lw: 3.6 }); d.mark((c, k) => label(c, 'Postgres', bx + bw / 2, gy + 34, { size: 30, al: k }), .06);
  g.drums.forEach((dr, k) => { d.fill(roundRectPath(dr.x, dr.y, dr.w, dr.h, 14), k === 3 ? '#EDE4D0' : C.mustard).line(dense(RP(dr.x, dr.y, dr.w, dr.h)), { w: 3, smooth: false });
    d.line([[dr.x + 4, dr.y + 22], [dr.x + dr.w / 2, dr.y + 30], [dr.x + dr.w - 4, dr.y + 22]], { w: 2.4 }); });
  // the ground and the two floors (a floor is a client; its apartments are projects)
  if (ground) d.line([[120, gy + 4], [960, gy + 2], [1800, gy + 5]], { w: 3.6 });
  boxD(d, bx, g.floorA.y, bw, g.floorA.h, C.mustardSoft, { lw: 3.6, r: 4 });
  boxD(d, bx, g.floorB.y, bw, g.floorB.h, C.lilacSoft, { lw: 3.6, r: 4 });
  const roof = [[bx - 20, g.floorB.y], [bx + bw / 2, top], [bx + bw + 20, g.floorB.y]]; d.fill(polyPath(roof), '#EDE4D0').line(dense(roof, true), { w: 3.6, smooth: false });
  // apartments: Shop on floor A (two environments), Blog on floor B (one, and room to grow)
  boxD(d, 668, 580, 408, 196, C.paper, { lw: 2.8, r: 8 }); boxD(d, 850, 324, 408, 196, C.paper, { lw: 2.8, r: 8 });
  // windows: environments; a lit window has its own lock
  g.win.forEach((w, k) => { const on = w.spare ? 0 : (lit[k] ?? 0);
    d.fill(roundRectPath(w.x, w.y, w.w, w.h, 6), w.spare ? '#E7E0D3' : mix('#DCD6E8', C.lit, on));
    d.line(dense(RP(w.x, w.y, w.w, w.h)), { w: 3.2, smooth: false, ...(w.spare ? { color: '#8E879A' } : {}) });
    d.line([[w.x + w.w / 2, w.y + 4], [w.x + w.w / 2, w.y + w.h - 4]], { w: 2.4, ...(w.spare ? { color: '#8E879A' } : {}) });
    if (!w.spare) d.mark((c, kk) => lockMark(c, w.x + w.w - 8, w.y + w.h + 2, .9, Math.min(kk, locks[k] ?? 0)), .04); });
  // the gateway booth, shared, where every request comes in
  const b = g.booth; boxD(d, b.x, b.y, b.w, b.h, C.coralSoft, { lw: 3.4 }); const aw = [[b.x - 14, b.y + 6], [b.x + b.w / 2, b.y - 34], [b.x + b.w + 14, b.y + 6]];
  d.fill(polyPath(aw), C.coral).line(dense(aw, true), { w: 3.2, smooth: false }).mark((c, k) => label(c, 'gateway', b.x + b.w / 2, b.y + 44, { size: 26, al: k }), .06);
  d.line(dense(RP(b.x + 50, b.y + 64, 50, 46), false), { w: 2.8, smooth: false });
  // Storage, shared, a tenant per environment
  const s = g.shed; boxD(d, s.x, s.y, s.w, s.h, C.coralSoft, { lw: 3.2, text: 'Storage', size: 26 });
  return d; }
// dotted pipes from each lit window down to its own drum
function pipes(c, k) { if (k <= 0) return; const g = G(); c.save(); c.strokeStyle = C.teal; c.lineWidth = 3; c.setLineDash([2, 10]); c.lineCap = 'round';
  [[0, 0], [1, 1], [2, 2]].forEach(([wi, di], j) => { const u = clamp(k * 3 - j, 0, 1); if (u <= 0) return; const w = g.win[wi], dr = g.drums[di];
    const a = [w.x + 20, w.y + w.h + 6], b = [dr.x + dr.w / 2, dr.y - 6], m = [a[0], (a[1] + b[1]) / 2]; c.beginPath(); c.moveTo(...a);
    const n = 30; for (let q = 1; q <= n * u; q++) { const t = q / n; c.lineTo(...bz(a, b, [lerp(a[0], b[0], .1), m[1] + 40], t)); } c.stroke(); }); c.restore(); }

// cached still building for the scenes that start with it already built
const cache = {};
function stillBuilding(c) { if (!cache.b) { cache.b = layer(); const g = cache.b.getContext('2d'); resetT(g); const d = doodle({ start: -30, seed: 7, speed: 1500, gap: .02 }); buildingD(d); d.draw(g, 0); pipes(g, 1); } c.drawImage(cache.b, 0, 0, W, H); }

// ---------- scenes ----------
// 1. Three full stacks on one server: every part repeated, and the server bends
function stack(d, x, base) { const w = 230; let y = base;
  [['Postgres', C.mustard, 92], ['Storage', C.pink, 58], ['REST', C.tealSoft, 58], ['Auth', C.tealSoft, 58], ['Studio', C.lilac, 58]].forEach(([t, col, h]) => { y -= h + 6; boxD(d, x - w / 2, y, w, h, col, { text: t, size: 28 }); }); return d; }
function sceneStacks(c, tau, i) { paper(c); zoomAt(c, 1.15, 960, 560); const base = 780, sag = 38 * sm(3.9, 5.6, tau, easeOutBack), wob = t => tau > 4.2 ? Math.sin(tau * 26 + t) * 3 * sm(4.2, 5, tau) : 0;
  const plank = x => base + 14 + sag * Math.sin(clamp((x - 200) / 1520, 0, 1) * Math.PI);
  // the one server they all sit on
  pen(c, tau, i, .1, 3, d => { const pts = []; for (let x = 200; x <= 1720; x += 40) pts.push([x, plank(x)]); d.line(pts, { w: 5 }); d.lines([[[260, plank(260)], [240, 900]], [[1660, plank(1660)], [1680, 900]]], { w: 4 }); }, { still: true });
  [[430, .5], [960, 1.7], [1490, 2.9]].forEach(([x, st], k) => { c.save(); c.translate(wob(k), plank(x) - base - 14); pen(c, tau, i, st, 11 + k, d => stack(d, x, base), { still: true }); c.restore(); });
  // sweat drops as it bends
  if (tau > 4.4) [[700, 560], [1220, 520]].forEach(([x, y], k) => { const u = ((tau - 4.4 - k * .3) % 1.1) / 1.1; if (u < 0) return; c.save(); c.fillStyle = '#7FB6E6'; c.globalAlpha = 1 - u; c.beginPath(); c.ellipse(x, y + u * 60, 7, 10, 0, 0, TAU); c.fill(); c.restore(); });
  pen(c, tau, i, 3.2, 21, d => cactus(d, 1760, 900, .82, tau > 4.4 ? 'worry' : 'rest')); }

// 2. One building: Postgres in the basement, clients on floors, projects as apartments, environments as lit windows
function sceneBuilding(c, tau, i) { paper(c); zoomAt(c, 1.1, 960, 600);
  const lit = [sm(4.0, 4.4, tau), sm(4.5, 4.9, tau), sm(5.0, 5.4, tau)], locks = [sm(4.3, 4.6, tau), sm(4.8, 5.1, tau), sm(5.3, 5.6, tau)];
  pen(c, tau, i, .2, 5, d => buildingD(d, { lit, locks }), { still: true, speed: 2600 });
  pipes(c, sm(5.6, 6.8, tau));
  lit.forEach((k, j) => { if (k > 0) glow(c, ...winC(G().win[j]), 110, '#FFE7A0', k * .5); });
  // the hierarchy, one ring at a time: a client (floor), a project (apartment), an environment (window)
  const g = G(), ring = (x, y, rx, ry, st, col) => { const u = sm(st, st + .6, tau); if (u <= 0) return; c.save(); c.strokeStyle = col; c.lineWidth = 5; c.setLineDash([16, 12]); c.lineCap = 'round';
    const pts = ellPts(x, y, rx, ry, 0, 80), n = Math.max(2, Math.round(pts.length * u)); c.beginPath(); pts.slice(0, n).forEach((p, q) => q ? c.lineTo(...p) : c.moveTo(...p)); if (u >= 1) c.closePath(); c.stroke(); c.restore(); };
  ring(g.bx + g.bw / 2, g.floorA.y + g.floorA.h / 2, 390, 150, 7.0, C.mustard);
  ring(872, 678, 232, 118, 7.8, C.coral);
  ring(...winC(g.win[0]), 104, 84, 8.6, C.teal);
  pen(c, tau, i, .8, 23, d => cactus(d, 1640, 900, .82, tau > 2.8 ? 'point' : 'rest')); }

// 3. Requests: paper planes go through the shared gateway to their own window; one without a key is refused
function sceneRequests(c, tau, i) { paper(c); zoomAt(c, 1.1, 960, 600); stillBuilding(c); const g = G();
  // devices on the left
  const dev = [[210, 470, 'phone'], [190, 640, 'laptop'], [230, 780, 'phone']];
  pen(c, tau, i, 0, 31, d => dev.forEach(([x, y, kind]) => { if (kind === 'phone') { boxD(d, x - 36, y - 62, 72, 124, '#3B3F6E', { r: 14 }); d.fill(roundRectPath(x - 28, y - 50, 56, 96, 6), C.tealSoft).line([[x - 10, y + 54], [x + 10, y + 54]], { w: 3 }); }
    else { boxD(d, x - 74, y - 54, 148, 96, '#3B3F6E', { r: 8 }); d.fill(roundRectPath(x - 64, y - 44, 128, 76, 4), C.lilacSoft).line([[x - 96, y + 44], [x + 96, y + 44]], { w: 4 }); } }), { still: true });
  g.win.slice(0, 3).forEach(w => glow(c, ...winC(w), 100, '#FFE7A0', .45));
  const door = [g.booth.x + g.booth.w / 2, g.booth.y + 60], flights = [[.5, 0, 0], [1.5, 1, 2], [2.5, 2, 1], [4.1, 1, -1]];
  flights.forEach(([st, from, to], k) => { const u = tau - st; if (u < 0) return; const a = dev[from], s0 = [a[0] + 40, a[1] - 40];
    if (u < 1.1) { const t = easeInOutSine(u / 1.1), cc = [(s0[0] + door[0]) / 2, Math.min(s0[1], door[1]) - 160], p = bz(s0, door, cc, t); plane(c, p[0], p[1], bzAng(s0, door, cc, t), 1.1, to < 0 ? '#D9D3E3' : C.paper); return; }
    if (to < 0) { // refused at the door: bounce back and a red cross
      const b = sm(1.1, 1.9, u), p = [lerp(door[0], door[0] - 170, easeOut(b)), door[1] - 90 * Math.sin(b * Math.PI) + 60 * b]; plane(c, p[0], p[1], Math.PI + .6 * b, 1.1, '#D9D3E3', 1 - sm(2.3, 2.8, u));
      crossMark(c, door[0] + 4, door[1] - 110, 1.1, sm(1.1, 1.5, u) * (1 - sm(3.0, 3.5, u))); return; }
    checkMark(c, door[0], door[1] - 112, .9, sm(1.1, 1.4, u) * (1 - sm(1.7, 2.0, u)));
    const w = g.win[to], tgt = winC(w), v = sm(1.3, 2.4, u, easeInOutSine), cc = [door[0] + 120, tgt[1] + 40];
    if (v < 1) { const p = bz(door, tgt, cc, v); plane(c, p[0], p[1], bzAng(door, tgt, cc, v), 1.1); }
    else { const f = 1 - sm(2.4, 3.2, u); glow(c, ...tgt, 150, '#FFF3B8', f * .9); checkMark(c, tgt[0], tgt[1] - 4, 1, sm(2.4, 2.7, u) * f); } });
  pen(c, tau, i, -9, 41, d => cactus(d, 1640, 900, .82, tau > 5.6 ? 'happy' : 'rest')); }

// 4. Night backups to an off-host cloud; morning, one window breaks and comes back from its parcel
function sceneNight(c, tau, i) { const k = sm(0, 1.2, tau) * (1 - sm(4.6, 5.6, tau)), g = G();
  paper(c); zoomAt(c, 1.1, 960, 600); stillBuilding(c);
  const cl = [1520, 200];
  pen(c, tau, i, .7, 51, d => { const cloud = [[cl[0] - 160, cl[1] + 40], [cl[0] - 150, cl[1] - 10], [cl[0] - 90, cl[1] - 50], [cl[0] - 20, cl[1] - 76], [cl[0] + 60, cl[1] - 56], [cl[0] + 130, cl[1] - 30], [cl[0] + 160, cl[1] + 30], [cl[0], cl[1] + 50]];
    d.fill(splinePath(cloud), C.paper).line(cloud, { close: true, w: 3.6 }).mark((c2, kk) => lockMark(c2, cl[0], cl[1] + 4, 1.4, kk), .2); }, { still: true });
  nightfall(c, k * .82);
  if (k > 0) { c.save(); c.globalAlpha = k; c.fillStyle = '#FFF3C4'; c.beginPath(); c.arc(300, 170, 56, 0, TAU); c.fill(); c.fillStyle = '#2A2F63'; c.beginPath(); c.arc(326, 152, 52, 0, TAU); c.fill();
    const r = rng(9); for (let q = 0; q < 26; q++) { const x = r() * 1900, y = r() * 330; if (Math.abs(x - cl[0]) < 190 && y > 110) continue; c.fillStyle = '#F7D774'; c.beginPath(); c.arc(x, y, 1.5 + r() * 2.2, 0, TAU); c.fill(); } c.restore(); }
  const broken = sm(5.3, 5.5, tau) * (1 - sm(7.3, 7.4, tau));
  g.win.slice(0, 3).forEach((w, j) => { const off = j === 1 ? broken : 0; if (off < 1) glow(c, ...winC(w), 110, '#FFE7A0', (.35 + k * .55) * (1 - off)); });
  if (broken > 0) { const w = g.win[1]; c.save(); c.globalAlpha = broken; c.fillStyle = '#5B5670'; c.beginPath(); c.roundRect(w.x, w.y, w.w, w.h, 6); c.fill(); c.strokeStyle = C.coral; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(w.x + 30, w.y + 20); c.lineTo(w.x + 66, w.y + 58); c.lineTo(w.x + 50, w.y + 70); c.lineTo(w.x + 96, w.y + 104); c.stroke(); c.restore(); }
  // parcels up at night, one comes back in the morning
  g.win.slice(0, 3).forEach((w, j) => { const u = sm(1.6 + j * .4, 3.2 + j * .4, tau, easeInOutSine); if (u <= 0 || u >= 1) return; const a = winC(w), b = [cl[0] - 40 + j * 40, cl[1] + 20], cc = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 180], p = bz(a, b, cc, u); parcel(c, p[0], p[1], .9); });
  const back = sm(6.0, 7.2, tau, easeInOutSine); if (back > 0 && back < 1) { const a = [cl[0], cl[1] + 30], b = winC(g.win[1]), cc = [1300, 300], p = bz(a, b, cc, back); parcel(c, p[0], p[1], .9); }
  if (tau > 7.3) { const w = g.win[1]; glow(c, ...winC(w), 150, '#FFF3B8', (1 - sm(7.8, 8.0, tau)) * .8); checkMark(c, ...winC(w), 1, sm(7.3, 7.6, tau)); }
  if (tau > 4.6) { const sun = sm(4.6, 5.8, tau); c.save(); c.globalAlpha = sun; c.fillStyle = C.mustard; c.beginPath(); c.arc(300, 170, 46, 0, TAU); c.fill(); c.strokeStyle = C.mustard; c.lineWidth = 5; c.lineCap = 'round';
    for (let q = 0; q < 10; q++) { const a = q / 10 * TAU + tau * .2; c.beginPath(); c.moveTo(300 + Math.cos(a) * 64, 170 + Math.sin(a) * 64); c.lineTo(300 + Math.cos(a) * 84, 170 + Math.sin(a) * 84); c.stroke(); } c.restore(); }
  pen(c, tau, i, -9, 61, d => cactus(d, 1640, 900, .82, tau > 7.4 ? 'happy' : tau > 5.4 ? 'worry' : 'rest')); }

// 5. One command installs it; the building lights up; the cactus waves; the wordmark
const CMD = ['$ sudo deploy/server-acceptance.sh --rehearse \\', '    --install-unit --first-project', '', 'Server acceptance: PASSED'];
function sceneInstall(c, tau, i) { paper(c); const tx = 150, ty = 250, tw = 980, th = 380;
  pen(c, tau, i, 0, 71, d => { d.fill(roundRectPath(tx, ty, tw, th, 18), '#211E29').line(dense(RP(tx, ty, tw, th)), { w: 4, smooth: false }); }, { still: true });
  if (tau > .5) { c.save(); ['#E06A4B', '#F0C23E', '#3E9E6E'].forEach((col, q) => { c.fillStyle = col; c.beginPath(); c.arc(tx + 36 + q * 30, ty + 32, 9, 0, TAU); c.fill(); }); c.restore(); }
  const typed = Math.floor(sm(.8, 3.4, tau, t => t) * (CMD[0].length + CMD[1].length));
  c.save(); c.font = '500 30px ui-monospace, "DejaVu Sans Mono", Menlo, monospace'; c.fillStyle = '#F3ECDC'; c.textBaseline = 'middle';
  c.fillText(CMD[0].slice(0, typed), tx + 36, ty + 110); if (typed > CMD[0].length) c.fillText(CMD[1].slice(0, typed - CMD[0].length), tx + 36, ty + 160);
  if (tau < 3.5 && Math.floor(tau * 2.5) % 2 === 0) { const line = typed > CMD[0].length ? 1 : 0, txt = line ? CMD[1].slice(0, typed - CMD[0].length) : CMD[0].slice(0, typed); c.fillRect(tx + 38 + c.measureText(txt).width, ty + (line ? 142 : 92), 16, 34); }
  if (tau > 3.7) { c.fillStyle = '#9BE3B8'; c.globalAlpha = sm(3.7, 4.0, tau); c.fillText(CMD[3], tx + 36, ty + 250); } c.restore();
  checkMark(c, tx + tw - 70, ty + th - 70, 1.3, sm(3.8, 4.2, tau), '#9BE3B8');
  // the building, small, lighting up
  c.save(); c.translate(1260, 190); c.scale(.52, .52); c.translate(-440, 0);
  const lit = [sm(4.4, 4.7, tau), sm(4.7, 5.0, tau), sm(5.0, 5.3, tau)];
  pen(c, tau, i, 3.9, 81, d => buildingD(d, { lit, locks: lit, ground: false }), { still: true, speed: 5200 });
  c.restore();
  pen(c, tau, i, 4.6, 91, d => cactus(d, 1760, 820, .62, 'wave', tau * 5));
  // wordmark
  const wm = sm(5.4, 6.4, tau); if (wm > 0) { const word = 'sbarbase', n = Math.ceil(word.length * wm); label(c, word.slice(0, n), CX - 300, 850, { size: 120, weight: 700, align: 'left' });
    c.save(); c.strokeStyle = C.coral; c.lineWidth = 6; c.lineCap = 'round'; c.globalAlpha = sm(6.2, 6.6, tau); c.beginPath(); c.moveTo(CX - 290, 918); c.quadraticCurveTo(CX, 940, CX + 250, 912); c.stroke(); c.restore(); } }
