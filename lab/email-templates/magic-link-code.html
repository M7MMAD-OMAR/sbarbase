<!--
  Magic link body for the pinned Auth (supabase/auth v2.197.0).

  The pinned Auth fetches this file over HTTP. A GOTRUE_MAILER_TEMPLATES_MAGIC_LINK value that
  starts with http is fetched as given, and a path such as /email-templates/magic-link-code.html
  is resolved against the environment's site URL (GOTRUE_SITE_URL), so that site has to serve
  this file at that path.

  It is deployment content and not a credential: no secret belongs in this file, and anyone who
  can fetch the page can read it.

  Inline styles only. Mail clients strip a style block and refuse external assets.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your sign in code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
<tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;border:1px solid #e4e7eb;">
<tr><td style="padding:32px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;line-height:28px;font-weight:600;color:#1c1f23;">Your sign in code</td></tr>
<tr><td style="padding:8px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;color:#3d454f;">Enter this code on the sign in page to finish signing in.</td></tr>
<tr><td align="center" style="padding:24px 32px 0 32px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;border:1px solid #dfe3e8;border-radius:6px;">
<tr><td style="padding:18px 24px;font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:36px;line-height:44px;font-weight:700;letter-spacing:8px;color:#111418;">{{ .Token }}</td></tr>
</table>
</td></tr>
<tr><td style="padding:24px 32px 0 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;color:#3d454f;">The code can be typed on the sign in page, and the link below does the same thing.</td></tr>
<tr><td style="padding:20px 32px 0 32px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr><td style="background-color:#1c1f23;border-radius:6px;">
<a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;">Sign in</a>
</td></tr>
</table>
</td></tr>
<tr><td style="padding:24px 32px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#5b6470;">If you did not ask to sign in, you can ignore this message.</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
