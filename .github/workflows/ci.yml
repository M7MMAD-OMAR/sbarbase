name: CI
# Unit tests, the console typecheck and build, and the Python suite on every push
# and pull request. The empty-host acceptance job is manual: it installs the whole
# placement on a fresh runner, which is the free clean-server rehearsal until a
# real server exists. A runner is ephemeral, so it proves an install from nothing,
# not reboots, retained volumes or a public certificate.
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      acceptance:
        description: Also run the empty-host install and rehearsal
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # ubuntu-26.04 ships /usr/bin/python3 3.14; the runtime requires 3.12 or newer.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: System Python dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-cryptography
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck:ui
      - run: bun run typecheck:control
      - run: bun run build:ui
      - name: Python unit tests
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: /usr/bin/python3 -m unittest discover -s lab -p 'test_*.py'
      - name: Python unit tests with no Docker daemon
        # A unit test must not need the daemon. An unreachable endpoint makes any
        # test that shells out to docker fail here instead of on the next machine.
        env:
          DOCKER_HOST: unix:///nonexistent/docker.sock
        run: /usr/bin/python3 -m unittest discover -s lab -p 'test_*.py'

  python-floor:
    # The oldest interpreter the preflight accepts: Ubuntu 24.04 ships
    # /usr/bin/python3 3.12. A syntax check and the unit tests, so a construct
    # newer than the floor fails in review rather than on an operator's server.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: System Python dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-cryptography
      - run: /usr/bin/python3 --version
      - name: Every lab and deploy script compiles on 3.12
        # Not every live probe or deploy helper is imported by a unit test.
        run: /usr/bin/python3 -m compileall -q lab deploy
      - name: Python unit tests on 3.12
        env:
          DOCKER_HOST: unix:///nonexistent/docker.sock
        run: /usr/bin/python3 -m unittest discover -s lab -p 'test_*.py'

  docker-install:
    # The Docker path from a clean runner: build, start, first operator, first
    # project through supabase-js, restart, and a clean stop. The host needs
    # nothing but Docker; Python, Bun and the Docker CLI come from the image.
    needs: checks
    runs-on: ubuntu-26.04
    # Two more broken upgrades each wait out a failed start (one a 120 s health deadline) and a
    # container restart back onto the previous version.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SBARBASE_CONSOLE_PORT: '8790'
      BASH_ENV: ${{ github.workspace }}/deploy/ci-docker.sh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Declare and admit the local Docker profile
        run: |
          socket=$(readlink -e /var/run/docker.sock)
          [ "$socket" = /run/docker.sock ]
          root=$(sudo docker --host unix:///run/docker.sock info --format '{{.DockerRootDir}}')
          root=$(sudo readlink -e -- "$root")
          export SBARBASE_ROOT="$GITHUB_WORKSPACE" SBARBASE_DOCKER_PROFILE=local-v1
          export SBARBASE_DOCKER_SOCKET="$socket" SBARBASE_DOCKER_DATA_ROOT="$root"
          export SBARBASE_COMPOSE_PROJECT="sbarbase-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export SBARBASE_CI_RUN="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export SBARBASE_LIVE_AUTH_FILE="$GITHUB_WORKSPACE/.secrets/ci-native-auth.json"
          ci_route check
          for input in SBARBASE_ROOT SBARBASE_DOCKER_PROFILE SBARBASE_DOCKER_SOCKET SBARBASE_DOCKER_DATA_ROOT SBARBASE_COMPOSE_PROJECT SBARBASE_CI_RUN SBARBASE_LIVE_AUTH_FILE; do
            printf '%s=%s\n' "$input" "${!input}" >> "$GITHUB_ENV"
          done
          echo 'SBARBASE_CI_SETUP=1' >> "$GITHUB_ENV"
      - name: Build and start
        run: ci_route up
      - name: Wait for the console
        run: |
          for i in $(seq 1 180); do
            curl -fsS -o /dev/null http://127.0.0.1:8790/ && exit 0
            restarts=$(ci_docker inspect -f '{{.RestartCount}}' "$(ci_compose ps -aq sbarbase)")
            [ "$restarts" = 0 ] || { echo "the control plane restarted $restarts time(s)"; ci_compose logs --tail 120; exit 1; }
            sleep 5
          done
          ci_compose logs --tail 80; exit 1
      - name: First operator (generated, never printed)
        run: |
          ci_exec sbarbase python3 -c 'import os,stat; from pathlib import Path; p=Path(".secrets"); p.mkdir(mode=0o700,exist_ok=True); s=p.lstat(); assert stat.S_ISDIR(s.st_mode) and s.st_uid==os.getuid() and stat.S_IMODE(s.st_mode)==0o700'
          python3 -c 'import json,secrets;print(json.dumps({"email":"operator@example.com","password":secrets.token_urlsafe(24),"organization":"Docker rehearsal"}))' \
            | ci_exec sbarbase python3 lab/operator_file.py --stdin "$PWD/.secrets/operator.json"
          ci_exec sbarbase sh -c 'python3 lab/bootstrap.py --stdin < .secrets/operator.json'
          ci_exec sbarbase python3 -c 'import json,os,sys,uuid; from pathlib import Path; run=str(uuid.UUID(sys.argv[1])); p=Path(os.environ["SBARBASE_LIVE_AUTH_FILE"]); fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600); f=os.fdopen(fd,"w"); json.dump({"schema":1,"run":run,"accounts":[]},f); f.flush(); os.fsync(f.fileno()); f.close()' "$SBARBASE_CI_RUN"
      - name: First project through supabase-js
        run: ci_exec sbarbase bun lab/first-project-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-first-project.json"
      - name: Back up, change, restore, compare
        run: ci_exec sbarbase python3 lab/backup-check.py --evidence "$PWD/docs/evidence/docker-backup-restore.json"
      - name: Encrypted off-site copy to S3-compatible storage, fetched and restored
        # A throwaway S3-compatible store stands in for R2, B2 or S3; its credentials exist only for this run.
        run: |
          export OFFSITE_KEY_ID=ci$(openssl rand -hex 8) OFFSITE_SECRET=$(openssl rand -hex 24)
          trap ci_offsite_cleanup EXIT
          # Resolve the pulled image to its immutable ID before owned creation.
          # S3Mock retains the original fallback; unit tests cover AWS signatures.
          ci_offsite_start
          ready=false
          for i in $(seq 1 90); do
            if curl -sS -o /dev/null http://127.0.0.1:9100/; then ready=true; break; fi
            sleep 1
          done
          [ "$ready" = true ]
          ci_exec -e OFFSITE_KEY_ID="$OFFSITE_KEY_ID" -e OFFSITE_SECRET="$OFFSITE_SECRET" sbarbase python3 lab/offsite-check.py \
            --endpoint http://127.0.0.1:9100 --bucket sbarbase-ci --peer "$SBARBASE_OFFSITE_PEER" --evidence "$PWD/docs/evidence/docker-offsite-checks.json"
      - name: Studio for the environment, behind the console login
        run: ci_exec sbarbase bun lab/studio-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-studio-checks.json"
      - name: Sign-in settings and an OAuth provider
        run: ci_exec sbarbase bun lab/sign-in-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-sign-in-checks.json"
      - name: Realtime for the environment
        run: ci_exec sbarbase bun lab/realtime-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-realtime-checks.json"
      - name: Edge Functions from a Supabase functions folder
        run: ci_exec sbarbase bun lab/functions-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-functions-checks.json"
      - name: Direct database access and a migration
        run: ci_exec sbarbase bun lab/database-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-database-checks.json"
      - name: Import a Supabase-shaped project into a new environment
        run: ci_exec sbarbase python3 lab/import-check.py "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-import-checks.json"
      - name: Rotate the environment's signing key
        run: ci_exec sbarbase python3 lab/signing-check.py "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-signing-checks.json"
      - name: Logs and metrics for the environment
        run: ci_exec sbarbase bun lab/observe-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-observe-checks.json"
      - name: Uploads larger than a MiB, then a new upload limit
        run: |
          ci_exec sbarbase bun lab/upload-check.ts "$PWD/.secrets/operator.json" --limit-mb 50 --evidence "$PWD/docs/evidence/docker-upload-checks.json"
          # A new limit applies at the next start by recreating the shared Storage container.
          SBARBASE_UPLOAD_LIMIT_MB=64 ci_route up
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://127.0.0.1:8790/ && break; sleep 5; done
          ci_exec sbarbase sh -c 'test "$SBARBASE_UPLOAD_LIMIT_MB" = 64'
          ci_exec sbarbase bun lab/upload-check.ts "$PWD/.secrets/operator.json" --limit-mb 64 --append --evidence "$PWD/docs/evidence/docker-upload-checks.json"
          SBARBASE_UPLOAD_LIMIT_MB=50 ci_route up
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://127.0.0.1:8790/ && break; sleep 5; done
      - name: Upgrade, broken upgrades that move back by themselves, and a refused unsigned tag
        # Each broken version compares users, files, buckets and the control catalog with the
        # recording before the first upgrade. The evidence file is written once, at the end: a
        # changed tracked file would make the next `upgrade.py start` refuse.
        run: |
          versions=$(python3 lab/upgrade-check.py candidates)
          eval "$versions"
          phase() {
            for i in $(seq 1 120); do
              p=$(sudo jq -r .phase .lab/upgrades/state.json 2>/dev/null || true)
              [ "$p" = "$1" ] && curl -fsS -o /dev/null http://127.0.0.1:8790/ && return 0
              case "$p" in failed|rollback_failed) break ;; esac
              sleep 5
            done
            echo "upgrade phase: $p (expected $1)"; ci_compose logs --tail 120; return 1
          }
          check() { ci_exec sbarbase python3 lab/upgrade-check.py "$@"; }
          upgrade() { ci_exec sbarbase python3 lab/upgrade.py "$@"; }
          check before base="$base" good="$good" bad="$bad" migrates="$migrates" unhealthy="$unhealthy"
          upgrade start --to "$good"
          ci_route restart
          phase confirmed
          check after upgraded
          # PostgREST never answers: the start fails and the supervisor moves back.
          upgrade start --to "$bad"
          ci_route restart
          phase rolled_back
          upgrade status
          check after rolled-back
          # The catalog is migrated, then the console stops: the snapshot goes back with the checkout.
          upgrade start --to "$migrates"
          ci_route restart
          phase rolled_back
          check after migration-rolled-back
          # Everything starts but /health never passes: traffic is held, then the deadline moves it back.
          upgrade start --to "$unhealthy"
          ci_route restart
          sudo python3 lab/upgrade-check.py hold
          phase rolled_back
          check after health-rolled-back
          # Unsigned and unlisted-key release tags are refused, and nothing moves.
          check unsigned
          check evidence "$PWD/docs/evidence/docker-upgrade-checks.json" \
            upgraded rolled-back migration-rolled-back hold health-rolled-back unsigned
      - name: Restart and come back
        run: |
          ci_route restart
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://127.0.0.1:8790/ && break; sleep 5; done
          ci_route smoke
      - name: Clean stop
        run: |
          ci_route down
          test -z "$(ci_compose ps -aq)"
          test -z "$(ci_docker ps -q --filter label=io.sbarbase.owner)"
      - name: Logs on failure
        if: failure()
        # A throwaway runner: its generated credentials exist only for this run.
        run: |
          # The upgrade checks recorded so far, marked incomplete (the file is kept below).
          ci_exec sbarbase python3 lab/upgrade-check.py evidence "$PWD/docs/evidence/docker-upgrade-checks.json" \
            upgraded rolled-back migration-rolled-back hold health-rolled-back unsigned || true
          ci_compose logs --tail 200 || true
          for c in $(ci_docker ps -aq --filter label=io.sbarbase.owner=durable-upstream) $(ci_docker ps -aq --filter label=io.sbarbase.owner=recovery-target); do echo "== $(ci_docker inspect -f '{{.Name}}' "$c")"; ci_docker logs --tail 80 "$c" 2>&1; done || true
          sudo sh -c 'for f in .lab/upstream/diagnostics/*.log; do echo "== $f"; tail -n 40 "$f"; done' || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-install-evidence
          path: docs/evidence/docker-*.json
          retention-days: 30
      - name: Close the owned CI installation after failure
        if: always() && env.SBARBASE_CI_SETUP == '1'
        run: |
          result=0
          ci_offsite_cleanup || result=1
          ci_route down || result=1
          test -z "$(ci_compose ps -aq)" || result=1
          test -z "$(ci_docker ps -q --filter label=io.sbarbase.owner)" || result=1
          exit "$result"

  empty-host-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Host facts
        run: nproc && free -m && df -h / && /usr/bin/python3 --version && docker --version
      - name: System Python dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-cryptography
      - name: Operator file (generated, never printed)
        run: |
          /usr/bin/python3 -c 'import json,secrets;print(json.dumps({"email":"operator@example.com","password":secrets.token_urlsafe(24),"organization":"CI rehearsal"}))' \
            | /usr/bin/python3 lab/operator_file.py --stdin "$RUNNER_TEMP/operator.json"
      - name: One-command acceptance on an empty host
        run: |
          sudo deploy/server-acceptance.sh --rehearse --install-unit \
            --service-user "$USER" --home "$HOME" --bun-dir "$(dirname "$(command -v bun)")" \
            --docker-host unix:///var/run/docker.sock --bootstrap-file "$RUNNER_TEMP/operator.json"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: empty-host-acceptance-evidence
          path: docs/evidence/*.json
          retention-days: 30
