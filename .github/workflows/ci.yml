name: CI
# Unit tests, the console typecheck and build, and the Python suite on every push
# and pull request. The empty-host acceptance job is manual: it installs the whole
# placement on a fresh runner, which is the free clean-server rehearsal until a
# real server exists. A runner is ephemeral, so it proves an install from nothing,
# not reboots, retained volumes or a public certificate.
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      acceptance:
        description: Also run the empty-host install and rehearsal
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # ubuntu-26.04 ships /usr/bin/python3 3.14, the interpreter the runtime requires.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: System Python dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-cryptography
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck:ui
      - run: bun run build:ui
      - name: Python unit tests
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: /usr/bin/python3 -m unittest discover -s lab -p 'test_*.py'
      - name: Python unit tests with no Docker daemon
        # A unit test must not need the daemon. An unreachable endpoint makes any
        # test that shells out to docker fail here instead of on the next machine.
        env:
          DOCKER_HOST: unix:///nonexistent/docker.sock
        run: /usr/bin/python3 -m unittest discover -s lab -p 'test_*.py'

  docker-install:
    # The Docker path from a clean runner: build, start, first operator, first
    # project through supabase-js, restart, and a clean stop. The host needs
    # nothing but Docker; Python, Bun and the Docker CLI come from the image.
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      SBARBASE_CONSOLE_PORT: '8790'
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for the console
        run: |
          for i in $(seq 1 180); do
            curl -fsS -o /dev/null http://127.0.0.1:8790/ && exit 0
            restarts=$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -aq sbarbase)")
            [ "$restarts" = 0 ] || { echo "the control plane restarted $restarts time(s)"; docker compose logs --tail 120; exit 1; }
            sleep 5
          done
          docker compose logs --tail 80; exit 1
      - name: First operator (generated, never printed)
        run: |
          mkdir -p .secrets
          python3 -c 'import json,secrets;print(json.dumps({"email":"operator@example.com","password":secrets.token_urlsafe(24),"organization":"Docker rehearsal"}))' \
            | docker compose exec -T sbarbase python3 lab/operator_file.py --stdin "$PWD/.secrets/operator.json"
          docker compose exec -T sbarbase sh -c 'python3 lab/bootstrap.py --stdin < .secrets/operator.json'
      - name: First project through supabase-js
        run: docker compose exec -T sbarbase bun lab/first-project-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-first-project.json"
      - name: Back up, change, restore, compare
        run: docker compose exec -T sbarbase python3 lab/backup-check.py --evidence "$PWD/docs/evidence/docker-backup-restore.json"
      - name: Studio for the environment, behind the console login
        run: docker compose exec -T sbarbase bun lab/studio-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-studio-checks.json"
      - name: Sign-in settings and an OAuth provider
        run: docker compose exec -T sbarbase bun lab/sign-in-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-sign-in-checks.json"
      - name: Realtime for the environment
        run: docker compose exec -T sbarbase bun lab/realtime-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-realtime-checks.json"
      - name: Logs and metrics for the environment
        run: docker compose exec -T sbarbase bun lab/observe-check.ts "$PWD/.secrets/operator.json" --evidence "$PWD/docs/evidence/docker-observe-checks.json"
      - name: Uploads larger than a MiB, then a new upload limit
        run: |
          docker compose exec -T sbarbase bun lab/upload-check.ts "$PWD/.secrets/operator.json" --limit-mb 50 --evidence "$PWD/docs/evidence/docker-upload-checks.json"
          # A new limit applies at the next start by recreating the shared Storage container.
          SBARBASE_UPLOAD_LIMIT_MB=64 docker compose up -d
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://127.0.0.1:8790/ && break; sleep 5; done
          docker compose exec -T sbarbase sh -c 'test "$SBARBASE_UPLOAD_LIMIT_MB" = 64'
          docker compose exec -T sbarbase bun lab/upload-check.ts "$PWD/.secrets/operator.json" --limit-mb 64 --append --evidence "$PWD/docs/evidence/docker-upload-checks.json"
          SBARBASE_UPLOAD_LIMIT_MB=50 docker compose up -d
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://127.0.0.1:8790/ && break; sleep 5; done
      - name: Upgrade, then a broken upgrade that moves back by itself
        run: |
          versions=$(python3 lab/upgrade-check.py candidates)
          eval "$versions"
          phase() {
            for i in $(seq 1 120); do
              p=$(sudo jq -r .phase .lab/upgrades/state.json 2>/dev/null || true)
              [ "$p" = "$1" ] && curl -fsS -o /dev/null http://127.0.0.1:8790/ && return 0
              case "$p" in failed|rollback_failed) break ;; esac
              sleep 5
            done
            echo "upgrade phase: $p (expected $1)"; docker compose logs --tail 120; return 1
          }
          docker compose exec -T sbarbase python3 lab/upgrade-check.py before "$good" "$bad"
          docker compose exec -T sbarbase python3 lab/upgrade.py start --to "$good"
          docker compose restart
          phase confirmed
          docker compose exec -T sbarbase python3 lab/upgrade-check.py after upgraded
          docker compose exec -T sbarbase python3 lab/upgrade.py start --to "$bad"
          docker compose restart
          phase rolled_back
          docker compose exec -T sbarbase python3 lab/upgrade.py status
          docker compose exec -T sbarbase python3 lab/upgrade-check.py after rolled-back --evidence "$PWD/docs/evidence/docker-upgrade-checks.json"
      - name: Restart and come back
        run: |
          docker compose restart
          for i in $(seq 1 120); do curl -fsS -o /dev/null http://127.0.0.1:8790/ && break; sleep 5; done
          docker compose exec -T sbarbase python3 lab/install_server.py smoke
      - name: Clean stop
        run: |
          docker compose down
          test -z "$(docker ps -q --filter label=io.sbarbase.owner)"
      - name: Logs on failure
        if: failure()
        # A throwaway runner: its generated credentials exist only for this run.
        run: |
          docker compose logs --tail 200 || true
          for c in $(docker ps -aq --filter name=-realtime); do echo "== $(docker inspect -f '{{.Name}}' $c)"; docker logs --tail 80 $c 2>&1; done || true
          sudo sh -c 'for f in .lab/upstream/diagnostics/*.log; do echo "== $f"; tail -n 40 "$f"; done' || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-install-evidence
          path: docs/evidence/docker-*.json
          retention-days: 30

  empty-host-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Host facts
        run: nproc && free -m && df -h / && /usr/bin/python3 --version && docker --version
      - name: System Python dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-cryptography
      - name: Operator file (generated, never printed)
        run: |
          /usr/bin/python3 -c 'import json,secrets;print(json.dumps({"email":"operator@example.com","password":secrets.token_urlsafe(24),"organization":"CI rehearsal"}))' \
            | /usr/bin/python3 lab/operator_file.py --stdin "$RUNNER_TEMP/operator.json"
      - name: One-command acceptance on an empty host
        run: |
          sudo deploy/server-acceptance.sh --rehearse --install-unit \
            --service-user "$USER" --home "$HOME" --bun-dir "$(dirname "$(command -v bun)")" \
            --docker-host unix:///var/run/docker.sock --bootstrap-file "$RUNNER_TEMP/operator.json"
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-host-acceptance-evidence
          path: docs/evidence/*.json
          retention-days: 30
