name: Live upgrade measure
# Checkpoint cp9 of docs/engineering/plans/2026-10-23-upgrades-without-outage.md: the upgrade features
# (the in place handover, the rolling replacement of PostgREST, the database window) measured on a real
# Docker installation, with a pulse client probing it every 200 ms the whole time. Started by hand only:
#
#   gh workflow run live-upgrade-measure.yml --ref main
#
# It installs Sbarbase at the released tag v0.9.0 under the Docker supervision shape the repository's own CI
# uses (deploy/ci-docker.sh: the compose project sbarbase-ci-*, SBARBASE_GUARDED=1 from
# deploy/container/start.sh, the console port pinned to 8790), then lab/live_upgrade_measure.py runs the
# scenarios and lab/live_upgrade_summary.py turns the pulse into the artifact. A runner is a shared,
# ephemeral machine with one environment and no customers; it is not the production server, and it runs the
# container restart policy where the server runs systemd (docs/engineering/upgrades-known-limits.md).
on:
  workflow_dispatch:
    inputs:
      stages:
        description: 'Comma separated stages, or all (setup,steady,base,handover,kill,rest,reconfigure,baseline,rest-none,window)'
        type: string
        default: all
permissions:
  contents: read
concurrency:
  group: live-upgrade-measure
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    env:
      SBARBASE_CONSOLE_PORT: '8790'
      BASH_ENV: ${{ github.workspace }}/deploy/ci-docker.sh
    steps:
      - name: Sbarbase at the released tag v0.9.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.9.0
          fetch-depth: 0
          fetch-tags: true
      - name: The measurement tools, from the ref this run was started on
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: _tools
      - name: Keep the tools outside the checkout the upgrades will move
        run: |
          mv _tools "$RUNNER_TEMP/tools"
          git status --porcelain
          test -z "$(git status --porcelain)"
          git describe --tags --exact-match HEAD
          git rev-parse HEAD
      - name: Host facts
        run: |
          nproc; free -m; df -h /; uname -r; cat /etc/os-release | head -3
          docker --version; docker compose version; /usr/bin/python3 --version
          systemctl --version | head -1 || true
      - name: Declare and admit the local Docker profile
        run: |
          socket=$(readlink -e /var/run/docker.sock)
          [ "$socket" = /run/docker.sock ]
          root=$(sudo docker --host unix:///run/docker.sock info --format '{{.DockerRootDir}}')
          root=$(sudo readlink -e -- "$root")
          export SBARBASE_ROOT="$GITHUB_WORKSPACE" SBARBASE_DOCKER_PROFILE=local-v1
          export SBARBASE_DOCKER_SOCKET="$socket" SBARBASE_DOCKER_DATA_ROOT="$root"
          export SBARBASE_COMPOSE_PROJECT="sbarbase-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export SBARBASE_CI_RUN="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export SBARBASE_LIVE_AUTH_FILE="$GITHUB_WORKSPACE/.secrets/ci-native-auth.json"
          ci_route check
          for input in SBARBASE_ROOT SBARBASE_DOCKER_PROFILE SBARBASE_DOCKER_SOCKET SBARBASE_DOCKER_DATA_ROOT SBARBASE_COMPOSE_PROJECT SBARBASE_CI_RUN SBARBASE_LIVE_AUTH_FILE; do
            printf '%s=%s\n' "$input" "${!input}" >> "$GITHUB_ENV"
          done
          echo 'SBARBASE_CI_SETUP=1' >> "$GITHUB_ENV"
      - name: Pull the pinned images, patiently
        # public.ecr.aws limits anonymous pulls per address, and runners share addresses: the install's own
        # pull gives up after four attempts (about 2.5 minutes), so a limited address fails the whole run. The
        # same images, by the same digests, are pulled here with a long retry; the install then finds them present.
        run: |
          python3 - <<'EOF' > "$RUNNER_TEMP/pins.txt"
          import json, pathlib
          seen = []
          def walk(value):
              if isinstance(value, dict):
                  for item in value.get('digests', []) if isinstance(value.get('digests'), list) else []:
                      if item not in seen:
                          seen.append(item)
                  for item in value.values():
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          for path in sorted(pathlib.Path('lab').glob('*.lock.json')):
              walk(json.loads(path.read_text()))
          print('\n'.join(seen))
          EOF
          cat "$RUNNER_TEMP/pins.txt"
          while read -r ref; do
            ok=false
            for attempt in $(seq 1 40); do
              if ci_docker pull -q "$ref" >/dev/null 2>"$RUNNER_TEMP/pull.err"; then ok=true; break; fi
              echo "pull of $ref failed (attempt $attempt): $(tail -c 200 "$RUNNER_TEMP/pull.err")"
              sleep 60
            done
            [ "$ok" = true ] || { echo "could not pull $ref"; exit 1; }
            echo "pulled $ref"
          done < "$RUNNER_TEMP/pins.txt"
      - name: Build and start (the release source is the local one the driver serves on 127.0.0.1:8099)
        run: ci_env env SBARBASE_RELEASE_SOURCE=http://127.0.0.1:8099 "$SBARBASE_ROOT/deploy/compose.sh" up
      - name: Wait for the console
        run: |
          mkdir -p "$RUNNER_TEMP/live-upgrade-measure"
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://127.0.0.1:8790/; then
              restarts=$(ci_docker inspect -f '{{.RestartCount}}' "$(ci_compose ps -aq sbarbase)")
              echo "console answers after $((i * 5)) s at most, container restarts so far: $restarts"
              echo "$restarts" > "$RUNNER_TEMP/live-upgrade-measure/first-start-restarts.txt"
              ci_compose logs --no-color sbarbase 2>&1 | sed -E 's/eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/[token]/g; s/sb_(publishable|secret)_[A-Za-z0-9_]+/[key]/g' > "$RUNNER_TEMP/live-upgrade-measure/first-start.log" || true
              exit 0
            fi
            # A restart is not fatal here: it is recorded, and the first start's log is kept (a finding if it happens).
            restarts=$(ci_docker inspect -f '{{.RestartCount}}' "$(ci_compose ps -aq sbarbase)")
            [ "$restarts" -le 3 ] || { echo "the control plane restarted $restarts times"; ci_compose logs --tail 150; exit 1; }
            sleep 5
          done
          ci_compose logs --tail 80; exit 1
      - name: First operator (generated, never printed)
        run: |
          ci_exec sbarbase python3 -c 'import os,stat; from pathlib import Path; p=Path(".secrets"); p.mkdir(mode=0o700,exist_ok=True); s=p.lstat(); assert stat.S_ISDIR(s.st_mode) and s.st_uid==os.getuid() and stat.S_IMODE(s.st_mode)==0o700'
          python3 -c 'import json,secrets;print(json.dumps({"email":"operator@example.com","password":secrets.token_urlsafe(24),"organization":"Live upgrade measure"}))' \
            | ci_exec sbarbase python3 lab/operator_file.py --stdin "$PWD/.secrets/operator.json"
          ci_exec sbarbase sh -c 'python3 lab/bootstrap.py --stdin < .secrets/operator.json'
          ci_exec sbarbase python3 -c 'import json,os,sys,uuid; from pathlib import Path; run=str(uuid.UUID(sys.argv[1])); p=Path(os.environ["SBARBASE_LIVE_AUTH_FILE"]); fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600); f=os.fdopen(fd,"w"); json.dump({"schema":1,"run":run,"accounts":[]},f); f.flush(); os.fsync(f.fileno()); f.close()' "$SBARBASE_CI_RUN"
      - name: The measurement
        id: measure
        env:
          STAGES: ${{ inputs.stages }}
        run: |
          python3 "$RUNNER_TEMP/tools/lab/live_upgrade_measure.py" run \
            --out "$RUNNER_TEMP/live-upgrade-measure" --private "$RUNNER_TEMP/live-upgrade-private" \
            --root "$GITHUB_WORKSPACE" --stages "${STAGES:-all}"
      - name: Summary
        if: always()
        run: |
          out="$RUNNER_TEMP/live-upgrade-measure"
          ls -la "$out" || true
          python3 - "$out/live-upgrade-measure.json" <<'EOF' || true
          import json, sys
          document = json.load(open(sys.argv[1]))
          for scenario in document['scenarios']:
              stats = scenario.get('stats', {})
              env = stats.get('env', {})
              print(scenario['name'], scenario.get('status'), (scenario.get('handover') or {}).get('result'),
                    'env failed', env.get('failed'), 'gap', env.get('longest_gap_s'), 'p99', (env.get('latency_ms') or {}).get('p99'))
          EOF
      - name: Logs on failure
        if: failure()
        run: |
          # A throwaway runner and a throwaway installation; tokens and keys are removed anyway.
          mkdir -p "$RUNNER_TEMP/live-upgrade-measure"
          ci_compose logs --tail 300 2>&1 | sed -E 's/eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/[token]/g; s/sb_(publishable|secret)_[A-Za-z0-9_]+/[key]/g' | tee "$RUNNER_TEMP/live-upgrade-measure/container-tail.log" || true
      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-upgrade-measure
          path: ${{ runner.temp }}/live-upgrade-measure
          if-no-files-found: error
          retention-days: 90
      - name: Close the owned CI installation
        if: always() && env.SBARBASE_CI_SETUP == '1'
        run: |
          result=0
          ci_route down || result=1
          test -z "$(ci_compose ps -aq)" || result=1
          exit "$result"
