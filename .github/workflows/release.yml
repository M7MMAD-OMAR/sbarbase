name: Verified source release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: verified-source-releases
  queue: max
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'M7MMAD-OMAR/sbarbase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Verify canonical signed checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'lab')
          import release_channel as channel
          tag = os.environ['RELEASE_TAG']
          expected = os.environ['RELEASE_COMMIT']
          if channel.tag_version(tag) is None:
              raise SystemExit('Invalid release tag')
          fetched = channel.fetch_release(tag, channel.CANONICAL)
          oid = channel.object_of(fetched)
          refusal = channel.verify(oid, name=tag)
          if refusal:
              raise SystemExit(refusal)
          commit = channel.commit_of(oid)
          if expected not in (oid, commit) or channel.object_of('HEAD') != commit:
              raise SystemExit('Canonical signed tag differs from the workflow checkout')
          ref = 'refs/tags/' + tag
          current = channel.object_of(ref)
          if current not in (oid, commit):
              raise SystemExit('Local release tag differs from the verified checkout')
          if current != oid:
              channel.git('update-ref', ref, oid, current)
          print('Verified signed release checkout:', tag, commit)
          PYCODE
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run typecheck:control
      - run: bun run typecheck:ui
      - run: bun run build:ui
      - run: bun test
      - run: python3 -m unittest discover -s lab -p test_release_channel.py -v
      - run: bun run build
        working-directory: website
      - run: bun test
        working-directory: website
      - name: Verify and publish source assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            python3 lab/release.py publish --tag "$RELEASE_TAG"
          else
            python3 lab/release.py publish --tag "$RELEASE_TAG" --latest
          fi
