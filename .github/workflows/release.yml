name: Verified source release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: verified-source-releases
  queue: max
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'M7MMAD-OMAR/sbarbase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:control
      - run: bun run typecheck:ui
      - run: bun run build:ui
      - run: bun test
      - run: python3 -m unittest discover -s lab -p test_release_channel.py -v
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - run: bun test
        working-directory: website
      - name: Verify and publish source assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            python3 lab/release.py publish --tag "$RELEASE_TAG"
          else
            python3 lab/release.py publish --tag "$RELEASE_TAG" --latest
          fi
